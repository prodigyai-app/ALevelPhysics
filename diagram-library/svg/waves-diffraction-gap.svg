<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-label="Waves diffracting through a narrow gap and a wide gap" width="940" height="360" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="360" fill="#ffffff"/><defs></defs><text x="240.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Gap about the same as λ</text><text x="240.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">lots of spreading</text><text x="700.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Gap much wider than λ</text><text x="700.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">little spreading</text><path d="M240 100V185M240 215V300" stroke="#1d2733" stroke-width="6"/><path d="M90 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M116 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M142 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M168 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M194 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M244 174A26 26 0 0 1 244 226" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M244 148A52 52 0 0 1 244 252" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M244 122A78 78 0 0 1 244 278" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M244 96A104 104 0 0 1 244 304" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M244 70A130 130 0 0 1 244 330" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M700 100V130M700 270V300" stroke="#1d2733" stroke-width="6"/><path d="M550 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M576 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M602 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M628 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M654 110V290" stroke="#5aa9f0" stroke-width="2"/><path d="M726 124Q736 200 726 276" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M752 124Q762 200 752 276" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M778 124Q788 200 778 276" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M804 124Q814 200 804 276" stroke="#5aa9f0" stroke-width="2" fill="none"/><path d="M830 124Q840 200 830 276" stroke="#5aa9f0" stroke-width="2" fill="none"/><text x="470.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">diffraction is most noticeable when the gap is similar to the wavelength</text></svg>