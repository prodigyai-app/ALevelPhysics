<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Resonance tube in water with a tuning fork, showing a node at the water surface and an antinode at the open end" width="900" height="440" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="440" fill="#ffffff"/><defs></defs><path d="M160 120V400Q160 420 180 420H340Q360 420 360 400V120" fill="none" stroke="#a9c4d4" stroke-width="3"/><path d="M162 200H358V418H162Z" fill="#7fc3e0" fill-opacity=".45"/><rect x="236" y="60" width="48" height="280" fill="#e8f3f8" fill-opacity=".15" stroke="#a9c4d4" stroke-width="3"/><rect x="239" y="200" width="42" height="138" fill="#7fc3e0" fill-opacity=".35"/><path d="M260 40V20M250 40V10M270 40V10" stroke="#9aa3ad" stroke-width="5"/><text x="300.0" y="24.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">tuning fork (known f)</text><path d="M248 60L250.0 60.0L250.0 64.7L250.1 69.3L250.1 74.0L250.2 78.7L250.3 83.3L250.5 88.0L250.7 92.7L250.9 97.3L251.1 102.0L251.3 106.7L251.6 111.3L251.9 116.0L252.2 120.7L252.6 125.3L252.9 130.0L253.3 134.7L253.7 139.3L254.1 144.0L254.6 148.7L255.0 153.3L255.5 158.0L255.9 162.7L256.4 167.3L256.9 172.0L257.4 176.7L257.9 181.3L258.4 186.0L259.0 190.7L259.5 195.3L260.0 200.0" stroke="#3f7fd6" stroke-width="2" fill="none"/><path d="M272 60L270.0 60.0L270.0 64.7L269.9 69.3L269.9 74.0L269.8 78.7L269.7 83.3L269.5 88.0L269.3 92.7L269.1 97.3L268.9 102.0L268.7 106.7L268.4 111.3L268.1 116.0L267.8 120.7L267.4 125.3L267.1 130.0L266.7 134.7L266.3 139.3L265.9 144.0L265.4 148.7L265.0 153.3L264.5 158.0L264.1 162.7L263.6 167.3L263.1 172.0L262.6 176.7L262.1 181.3L261.6 186.0L261.0 190.7L260.5 195.3L260.0 200.0" stroke="#3f7fd6" stroke-width="2" fill="none"/><path d="M214.0 130.0L214.0 190.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M214.0 200.0L209.0 190.0L219.0 190.0Z" fill="#1d2733"/><path d="M214.0 130.0L214.0 70.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M214.0 60.0L219.0 70.0L209.0 70.0Z" fill="#1d2733"/><text x="206.0" y="134.0" font-size="15" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">L</text><text x="300.0" y="64.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">antinode (just above the open end)</text><text x="300.0" y="204.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">node at the water surface</text><text x="380.0" y="300.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">raise the tube until the</text><text x="380.0" y="316.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">sound is loudest (first resonance)</text><text x="640.0" y="140.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">first resonance:</text><text x="640.0" y="166.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">L + c = λ ÷ 4</text><text x="640.0" y="196.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">c = end correction (≈ 0.3 d)</text><text x="640.0" y="232.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">second resonance: L₂ + c = 3λ ÷ 4</text><text x="640.0" y="252.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">so λ = 2 (L₂ − L₁)</text><text x="640.0" y="286.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">v = f λ</text></svg>