"round" opacity=".14"/><path d="M610.0 340.0L610.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="610.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">70</text><path d="M90 60.0V340M90 340.0H610" stroke="#1d2733" stroke-width="2" fill="none"/><text x="350.0" y="384.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Speed v / m s⁻¹</text><g transform="rotate(-90 32.0 200.0)"><text x="32.0" y="200.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Force / N</text></g><text x="350.0" y="32.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Drag rises with speed until it equals the weight</text><path d="M90.0 120.3L610.0 120.3" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="112.3" y="110.3" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">weight W = 785 N (80 kg)</text><path d="M90.0 340.0L93.9 340.0L97.8 339.9L101.7 339.8L105.6 339.7L109.5 339.5L113.4 339.3L117.3 339.1L121.2 338.8L125.1 338.4L129.0 338.1L132.9 337.7L136.8 337.2L140.7 336.7L144.6 336.2L148.5 335.7L152.4 335.1L156.3 334.4L160.2 333.7L164.1 333.0L168.0 332.3L171.9 331.5L175.8 330.7L179.7 329.8L183.6 328.9L187.5 327.9L191.4 327.0L195.3 325.9L199.2 324.9L203.1 323.8L207.0 322.6L210.9 321.5L214.8 320.2L218.7 319.0L222.6 317.7L226.5 316.4L230.4 315.0L234.3 313.6L238.2 312.1L242.1 310.7L246.0 309.1L249.9 307.6L253.8 306.0L257.7 304.3L261.6 302.6L265.5 300.9L269.4 299.2L273.3 297.4L277.2 295.5L281.1 293.7L285.0 291.8L288.9 289.8L292.8 287.8L296.7 285.8L300.6 283.7L304.5 281.6L308.4 279.5L312.3 277.3L316.2 275.1L320.1 272.8L324.0 270.5L327.9 268.2L331.8 265.8L335.7 263.4L339.6 261.0L343.5 258.5L347.4 256.0L351.3 253.4L355.2 250.8L359.1 248.1L363.0 245.5L366.9 242.7L370.8 240.0L374.7 237.2L378.6 234.3L382.5 231.5L386.4 228.6L390.3 225.6L394.2 222.6L398.1 219.6L402.0 216.5L405.9 213.4L409.8 210.3L413.7 207.1L417.6 203.9L421.5 200.6L425.4 197.3L429.3 194.0L433.2 190.6L437.1 187.2L441.0 183.7L444.9 180.2L448.8 176.7L452.7 173.1L456.6 169.5L460.5 165.9L464.4 162.2L468.3 158.5L472.2 154.7L476.1 150.9L480.0 147.1L483.9 143.2L487.8 139.3L491.7 135.3L495.6 131.3L499.5 127.3L503.4 123.2L507.3 119.1L511.2 115.0L515.1 110.8L519.0 106.5L522.9 102.3L526.8 98.0L530.7 93.6L534.6 89.3L538.5 84.8L542.4 80.4L546.3 75.9L550.2 71.4L554.1 66.8L558.0 62.2" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="441.7" y="217.9" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">drag D = kv²</text><path d="M506.2 120.3L506.2 340.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="6 5" opacity=".7"/><circle cx="506.2" cy="120.3" r="6" fill="#e0a64a"/><text x="516.2" y="146.3" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">terminal velocity</text><text x="516.2" y="164.3" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">≈ 56 m s⁻¹</text><path d="M312.9 198.6L312.9 267.0" stroke="#3fb27f" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M312.9 277.0L307.9 267.0L317.9 267.0Z" fill="#3fb27f"/><path d="M312.9 198.6L312.9 130.3" stroke="#3fb27f" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M312.9 120.3L317.9 130.3L307.9 130.3Z" fill="#3fb27f"/><text x="320.9" y="202.6" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">resultant</text><text x="320.9" y="218.6" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">W − D</text><text x="650.0" y="90.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Drag depends on</text><text x="650.0" y="110.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">• speed (D ∝ v² when turbulent)</text><text x="650.0" y="130.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">• cross-sectional area</text><text x="650.0" y="150.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">• shape (streamlining)</text><text x="650.0" y="170.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">• density of the fluid</text><text x="650.0" y="190.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="650.0" y="210.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">a = (W − D) ÷ m</text><text x="650.0" y="230.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">so the acceleration falls</text><text x="650.0" y="250.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">as the speed rises</text><text x="650.0" y="270.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="650.0" y="290.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">k = 0.25 kg m⁻¹ here:</text><text x="650.0" y="310.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">v<tspan dy="0.32em" font-size="72%">t</tspan><tspan dy="-0.23em"> = √(W ÷ k) = 56 m s⁻¹</tspan></text></svg>