<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="Finding the centre of mass with plumb lines, and stability of a tilted block" width="920" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="380" fill="#ffffff"/><defs></defs><text x="230.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Finding the centre of mass</text><text x="230.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">hang the shape from two points; draw the plumb lines</text><text x="690.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Stability</text><text x="690.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">topples when the line of action of weight passes outside the base</text><path d="M120 110L320 130L300 300L150 260Z" fill="#9fd4e6" opacity=".55" stroke="#5aa9f0" stroke-width="2"/><circle cx="125" cy="115" r="5" fill="#1d2733"/><circle cx="315" cy="132" r="5" fill="#1d2733"/><path d="M125 115L240 290" stroke="#ef5b4c" stroke-width="2" stroke-dasharray="6 4"/><path d="M315 132L170 240" stroke="#e0a64a" stroke-width="2" stroke-dasharray="6 4"/><circle cx="214" cy="225" r="7" fill="#1d2733"/><text x="222.0" y="246.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">centre of mass</text><text x="230.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">a plumb line hangs straight down through the pivot</text><g transform="rotate(-20 560 300)"><rect x="560" y="160" width="80" height="140" fill="#3fb27f" opacity=".75"/></g><circle cx="574" cy="220" r="6" fill="#1d2733"/><path d="M574.0 220.0L574.0 306.0" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M574.0 318.0L568.0 306.0L580.0 306.0Z" fill="#ef5b4c"/><text x="600.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">stable: weight acts inside the base</text><g transform="rotate(-42 790 300)"><rect x="790" y="160" width="80" height="140" fill="#ef5b4c" opacity=".7"/></g><circle cx="773" cy="221" r="6" fill="#1d2733"/><path d="M773.0 221.0L773.0 306.0" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M773.0 318.0L767.0 306.0L779.0 306.0Z" fill="#ef5b4c"/><text x="800.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">topples</text><path d="M520 300H900" stroke="#1d2733" stroke-width="2"/></svg>