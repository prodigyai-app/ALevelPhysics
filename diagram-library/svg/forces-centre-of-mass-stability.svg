<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="Finding the centre of mass with plumb lines, and stability of a tilted block" width="920" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="380" fill="#ffffff"/><defs></defs><text x="230.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Finding the centre of mass</text><text x="230.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">hang the shape from two points; draw the plumb lines</text><text x="690.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Stability</text><text x="690.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">topples when the line of action of weight passes outside the base</text><defs><linearGradient id="sgcm23c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4e6c8"/><stop offset="1" stop-color="#d9c296"/></linearGradient><linearGradient id="sgcm23g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd29a"/><stop offset="1" stop-color="#2a8a5a"/></linearGradient><linearGradient id="sgcm23r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#b83a2c"/></linearGradient></defs><rect x="96" y="96" width="70" height="8" rx="3" fill="#7d858f"/><circle cx="125" cy="115" r="4" fill="#3d4654"/><path d="M120 110L320 130L300 300L150 260Z" fill="url(#sgcm23c)" stroke="#a8915e" stroke-width="2"/><path d="M124 116L304 134L288 292L156 258Z" fill="none" stroke="#fff" stroke-width="1" opacity=".4"/><circle cx="125" cy="115" r="5" fill="#fff" stroke="#55606c"/><circle cx="315" cy="132" r="5" fill="#fff" stroke="#55606c"/><path d="M125 115L240 290" stroke="#ef5b4c" stroke-width="2" stroke-dasharray="6 4"/><path d="M315 132L170 240" stroke="#e0a64a" stroke-width="2" stroke-dasharray="6 4"/><path d="M125 115L125 200" stroke="#55606c" stroke-width="1.2"/><path d="M119 200h12l-6 12z" fill="#55606c"/><circle cx="214" cy="225" r="7" fill="#1d2733"/><text x="222.0" y="246.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">centre of mass</text><text x="230.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">a plumb line hangs straight down through the pivot</text><rect x="520" y="300" width="380" height="10" rx="3" fill="#8f9aa6"/><g transform="rotate(-20 560 300)"><rect x="560" y="160" width="80" height="140" rx="3" fill="url(#sgcm23g)" stroke="#1f6a44" stroke-width="1.5"/><rect x="566" y="166" width="12" height="128" fill="#fff" opacity=".2"/></g><circle cx="574" cy="220" r="6" fill="#1d2733"/><path d="M574.0 220.0L574.0 306.0" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M574.0 318.0L568.0 306.0L580.0 306.0Z" fill="#ef5b4c"/><text x="600.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">stable: weight acts inside the base</text><g transform="rotate(-42 790 300)"><rect x="790" y="160" width="80" height="140" rx="3" fill="url(#sgcm23r)" stroke="#6e1c12" stroke-width="1.5"/><rect x="796" y="166" width="12" height="128" fill="#fff" opacity=".2"/></g><circle cx="773" cy="221" r="6" fill="#1d2733"/><path d="M773.0 221.0L773.0 306.0" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M773.0 318.0L767.0 306.0L779.0 306.0Z" fill="#ef5b4c"/><text x="800.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">topples</text></svg>