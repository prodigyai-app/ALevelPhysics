<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-label="Schematic timeline from the Big Bang through inflation, nucleosynthesis, the CMB, the first galaxies and accelerating expansion to today, and a pie chart of dark energy, dark matter and ordinary matter" width="940" height="410" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="410" fill="#ffffff"/><defs></defs><text x="330.0" y="28.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">History of the universe (schematic; times not to scale)</text><path d="M40 210H620" stroke="#1d2733" stroke-width="3"/><path d="M610.0 210.0L618.0 210.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M630.0 210.0L618.0 216.0L618.0 204.0Z" fill="#1d2733"/><circle cx="40.0" cy="210" r="7" fill="#e0a64a"/><path d="M40.0 202.0L40.0 170.0" stroke="#e0a64a" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="40.0" y="118.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">Big Bang</text><text x="40.0" y="134.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">t = 0</text><circle cx="122.9" cy="210" r="7" fill="#9b6bd6"/><path d="M122.9 218.0L122.9 250.0" stroke="#9b6bd6" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="122.9" y="270.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#9b6bd6">Inflation</text><text x="122.9" y="286.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">~10⁻³⁶ s</text><text x="122.9" y="302.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">rapid expansion</text><circle cx="205.7" cy="210" r="7" fill="#9b6bd6"/><path d="M205.7 202.0L205.7 170.0" stroke="#9b6bd6" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="205.7" y="118.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#9b6bd6">Quarks → nucleons</text><text x="205.7" y="134.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">~10⁻⁶ s</text><circle cx="288.6" cy="210" r="7" fill="#3f7fd6"/><path d="M288.6 218.0L288.6 250.0" stroke="#3f7fd6" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="288.6" y="270.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">Nucleosynthesis</text><text x="288.6" y="286.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">~3 minutes</text><text x="288.6" y="302.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">H and He nuclei form</text><circle cx="371.4" cy="210" r="7" fill="#ef5b4c"/><path d="M371.4 202.0L371.4 170.0" stroke="#ef5b4c" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="371.4" y="118.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">CMB released</text><text x="371.4" y="134.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">~380 000 years</text><text x="371.4" y="150.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">atoms form; light travels freely</text><circle cx="454.3" cy="210" r="7" fill="#3fb27f"/><path d="M454.3 218.0L454.3 250.0" stroke="#3fb27f" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="454.3" y="270.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">First stars and galaxies</text><text x="454.3" y="286.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">~200 million years</text><circle cx="537.1" cy="210" r="7" fill="#3fb27f"/><path d="M537.1 202.0L537.1 170.0" stroke="#3fb27f" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="537.1" y="118.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">Expansion accelerates</text><text x="537.1" y="134.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">~9 billion years</text><text x="537.1" y="150.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">dark energy dominates</text><circle cx="620.0" cy="210" r="7" fill="#e0a64a"/><path d="M620.0 218.0L620.0 250.0" stroke="#e0a64a" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="620.0" y="270.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">Today</text><text x="620.0" y="286.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">13.8 billion years</text><text x="790.0" y="70.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Make-up of the universe today</text><path d="M790 210L790.0 110.0A100 100 0 1 1 699.5 252.6Z" fill="#9b6bd6" stroke="var(--panel,#fff)" stroke-width="2"/><text x="836.4" y="243.5" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">68 %</text><path d="M790 210L699.5 252.6A100 100 0 0 1 759.1 114.9Z" fill="#8a94a0" stroke="var(--panel,#fff)" stroke-width="2"/><text x="739.5" y="192.2" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">27 %</text><path d="M790 210L759.1 114.9A100 100 0 0 1 790.0 110.0Z" fill="#e0a64a" stroke="var(--panel,#fff)" stroke-width="2"/><text x="770.3" y="89.6" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">5 %</text><rect x="700" y="336" width="12" height="12" fill="#9b6bd6"/><text x="720.0" y="347.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">dark energy 68 %</text><rect x="700" y="356" width="12" height="12" fill="#8a94a0"/><text x="720.0" y="367.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">dark matter 27 %</text><rect x="700" y="376" width="12" height="12" fill="#e0a64a"/><text x="720.0" y="387.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">ordinary matter 5 %</text><text x="790.0" y="404.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">dark matter: from galaxy rotation curves</text></svg>