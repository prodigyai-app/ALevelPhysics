ays</text><text x="700.0" y="236.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">strongly: soft organs like the gut</text><text x="700.0" y="252.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">and blood vessels show up</text><text x="460.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Attenuation of X-rays</text></svg>