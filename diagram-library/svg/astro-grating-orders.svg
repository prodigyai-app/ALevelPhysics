="round"/><path d="M226.0 355.0L234.0 355.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M226.0 363.0L234.0 363.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M226.0 371.0L234.0 371.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="230.0" y="394.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">grating</text><text x="230.0" y="410.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">300 lines per mm</text><path d="M60 235H230" stroke="#ef5b4c" stroke-width="5"/><text x="110.0" y="221.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">laser, λ = 656 nm</text><path d="M475.0 50.0L475.0 420.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="475.0" y="438.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">screen</text><path d="M230.0 235.0L475.0 414.2" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="475.0" cy="414.2" r="6" fill="#ef5b4c"/><text x="489.0" y="419.2" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">n = −3,  θ = 36.2°</text><path d="M230.0 235.0L475.0 339.9" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="475.0" cy="339.9" r="6" fill="#ef5b4c"/><text x="489.0" y="344.9" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">n = −2,  θ = 23.2°</text><path d="M230.0 235.0L475.0 284.2" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="475.0" cy="284.2" r="6" fill="#ef5b4c"/><text x="489.0" y="289.2" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">n = −1,  θ = 11.3°</text><path d="M230.0 235.0L475.0 235.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="475.0" cy="235.0" r="6" fill="#ef5b4c"/><text x="489.0" y="240.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">n = 0  (straight through)</text><path d="M230.0 235.0L475.0 185.8" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="475.0" cy="185.8" r="6" fill="#ef5b4c"/><text x="489.0" y="190.8" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">n = +1,  θ = 11.3°</text><path d="M230.0 235.0L475.0 130.1" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="475.0" cy="130.1" r="6" fill="#ef5b4c"/><text x="489.0" y="135.1" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">n = +2,  θ = 23.2°</text><path d="M230.0 235.0L475.0 55.8" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="475.0" cy="55.8" r="6" fill="#ef5b4c"/><text x="489.0" y="60.8" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">n = +3,  θ = 36.2°</text><path d="M340 235A110 110 0 0 0 337.8 213.4" fill="none" stroke="#1d2733" stroke-width="1.5"/><text x="348.0" y="229.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">θ₁</text><text x="40.0" y="80.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">d = 1 ÷ 300 000 m⁻¹</text><text x="40.0" y="99.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">  = 3.33 μm</text><text x="40.0" y="118.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="40.0" y="137.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">sin θ ≤ 1, so</text><text x="40.0" y="156.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">n<tspan dy="0.32em" font-size="72%">max</tspan><tspan dy="-0.23em"> = d ÷ λ = 5.08</tspan></text><text x="40.0" y="175.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">→ 5 orders each side</text><text x="470.0" y="462.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">Each slit is a source; the beams reinforce where the path difference from neighbouring slits is nλ. Orders 4 and 5 miss this screen.</text></svg>