<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-label="Acoustic impedance and the fraction of ultrasound reflected at a boundary" width="920" height="360" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="360" fill="#ffffff"/><defs></defs><text x="460.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Acoustic impedance and reflection</text><text x="460.0" y="54.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Z = ρ c   (density × speed of sound)</text><rect x="80" y="110" width="200" height="160" fill="#f4e3a0" opacity=".7"/><rect x="280" y="110" width="200" height="160" fill="#efece2" opacity=".85"/><text x="180.0" y="290.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">soft tissue</text><text x="380.0" y="290.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">bone</text><path d="M120.0 160.0L258.2 187.6" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M270.0 190.0L257.1 193.5L259.4 181.8Z" fill="#3f7fd6"/><path d="M270.0 196.0L151.5 232.5" stroke="#3f7fd6" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M140.0 236.0L149.7 226.7L153.2 238.2Z" fill="#3f7fd6"/><path d="M290.0 192.0L428.2 219.6" stroke="#3f7fd6" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M440.0 222.0L427.1 225.5L429.4 213.8Z" fill="#3f7fd6"/><text x="130.0" y="150.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#1d2733">incident</text><text x="150.0" y="256.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#1d2733">reflected</text><text x="470.0" y="250.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733" style="fill:#1d2733">transmitted</text><text x="700.0" y="120.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">fraction reflected</text><text x="700.0" y="150.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">I_r ÷ I₀ = (Z₂ − Z₁)² ÷ (Z₂ + Z₁)²</text><text x="700.0" y="200.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">big difference in Z → most reflects</text><text x="700.0" y="220.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">air–skin: almost 100%, so use gel</text><text x="700.0" y="240.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">gel has Z close to skin</text><text x="460.0" y="336.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">reflections at boundaries between tissues build the ultrasound image</text></svg>