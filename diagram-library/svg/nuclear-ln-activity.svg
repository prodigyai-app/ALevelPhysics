"none"/><text x="325.0" y="384.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Time t / s</text><g transform="rotate(-90 60.0 205.0)"><text x="60.0" y="205.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">ln (A / Bq)</text></g><text x="330.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Protactinium-234m: ln A falls in a straight line</text><path d="M100.0 81.5L550.0 241.9" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100.0" cy="79.9" r="5" fill="#ef5b4c"/><circle cx="145.0" cy="99.7" r="5" fill="#ef5b4c"/><circle cx="190.0" cy="112.5" r="5" fill="#ef5b4c"/><circle cx="235.0" cy="126.9" r="5" fill="#ef5b4c"/><circle cx="280.0" cy="147.3" r="5" fill="#ef5b4c"/><circle cx="325.0" cy="161.1" r="5" fill="#ef5b4c"/><circle cx="370.0" cy="180.4" r="5" fill="#ef5b4c"/><circle cx="415.0" cy="191.6" r="5" fill="#ef5b4c"/><circle cx="460.0" cy="210.9" r="5" fill="#ef5b4c"/><circle cx="505.0" cy="224.2" r="5" fill="#ef5b4c"/><circle cx="550.0" cy="242.4" r="5" fill="#ef5b4c"/><path d="M175 108.21112285422458H475V215.15383071204468" fill="none" stroke="#e0a64a" stroke-width="2"/><text x="325.0" y="100.2" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">Δt = 200 s</text><text x="483.0" y="161.7" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">Δ ln A = −1.98</text><text x="112.0" y="71.5" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">intercept ln A₀ = 4.79 → A₀ = 120 Bq</text><text x="590.0" y="100.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">A = A₀e^(−λt)</text><text x="590.0" y="120.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">ln A = ln A₀ − λt</text><text x="590.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">so ln A against t is a straight line</text><text x="590.0" y="160.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="590.0" y="180.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">gradient = −1.98 ÷ 200</text><text x="590.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">= −0.0099 s⁻¹ = −λ</text><text x="590.0" y="220.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">t½ = ln 2 ÷ λ = 70 s</text><text x="590.0" y="240.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="590.0" y="260.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Points scatter about the line</text><text x="590.0" y="280.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">because decay is random.</text></svg>