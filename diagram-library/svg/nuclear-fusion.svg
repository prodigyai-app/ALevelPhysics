<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Fusion of deuterium and tritium into helium and a neutron" width="920" height="340" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="340" fill="#ffffff"/><defs></defs><circle cx="110.0" cy="170.0" r="9" fill="#ef5b4c" stroke="#222" stroke-width=".6"/><circle cx="103.4" cy="176.1" r="9" fill="#9aa3ad" stroke="#222" stroke-width=".6"/><text x="110.0" y="230.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">deuterium ²H</text><text x="190.0" y="176.0" font-size="22" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">+</text><circle cx="270.0" cy="170.0" r="9" fill="#ef5b4c" stroke="#222" stroke-width=".6"/><circle cx="263.4" cy="176.1" r="9" fill="#9aa3ad" stroke="#222" stroke-width=".6"/><circle cx="271.1" cy="157.3" r="9" fill="#9aa3ad" stroke="#222" stroke-width=".6"/><text x="270.0" y="230.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">tritium ³H</text><path d="M340.0 170.0L418.0 170.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M430.0 170.0L418.0 176.0L418.0 164.0Z" fill="#1d2733"/><circle cx="510.0" cy="170.0" r="9" fill="#ef5b4c" stroke="#222" stroke-width=".6"/><circle cx="503.4" cy="176.1" r="9" fill="#ef5b4c" stroke="#222" stroke-width=".6"/><circle cx="511.1" cy="157.3" r="9" fill="#9aa3ad" stroke="#222" stroke-width=".6"/><circle cx="519.5" cy="182.4" r="9" fill="#9aa3ad" stroke="#222" stroke-width=".6"/><text x="510.0" y="230.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">helium ⁴He</text><text x="580.0" y="176.0" font-size="22" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">+</text><circle cx="640.0" cy="170.0" r="9" fill="#9aa3ad" stroke="#222" stroke-width=".6"/><text x="640.0" y="230.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">neutron</text><text x="720.0" y="176.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">+ 17.6 MeV</text><text x="460.0" y="40.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Nuclear fusion: light nuclei join to make a heavier nucleus</text><text x="460.0" y="280.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">needs a very high temperature and density to overcome the electrostatic repulsion</text><text x="460.0" y="300.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">the mass of the products is less than the mass of the reactants: energy = Δm c²</text></svg>