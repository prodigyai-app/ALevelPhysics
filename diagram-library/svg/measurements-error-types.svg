<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-label="Four sets of repeat readings of g showing accurate and precise, precise but not accurate from a systematic error, accurate but not precise from random error, and neither" width="940" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="400" fill="#ffffff"/><defs></defs><text x="470.0" y="28.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Six repeat readings of g compared with the true value 9.81 m s⁻²</text><text x="40.0" y="85.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">accurate and precise</text><path d="M399.9999999999998 80H889.9999999999999" stroke="#1d2733" stroke-width="1.5" opacity=".5"/><circle cx="606.5" cy="80.0" r="6" fill="#3fb27f"/><circle cx="617.0" cy="80.0" r="6" fill="#3fb27f"/><circle cx="624.0" cy="80.0" r="6" fill="#3fb27f"/><circle cx="610.0" cy="80.0" r="6" fill="#3fb27f"/><circle cx="613.5" cy="80.0" r="6" fill="#3fb27f"/><circle cx="620.5" cy="80.0" r="6" fill="#3fb27f"/><path d="M615.2 64.0L615.2 96.0" stroke="#3fb27f" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="623.2" y="110.0" font-size="11" font-weight="700" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3fb27f;stroke:var(--panel,#fff);stroke-width:4px;paint-order:stroke">mean 9.81</text><text x="40.0" y="151.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">precise, not accurate</text><path d="M399.9999999999998 146H889.9999999999999" stroke="#1d2733" stroke-width="1.5" opacity=".5"/><circle cx="729.0" cy="146.0" r="6" fill="#e0a64a"/><circle cx="739.5" cy="146.0" r="6" fill="#e0a64a"/><circle cx="746.5" cy="146.0" r="6" fill="#e0a64a"/><circle cx="732.5" cy="146.0" r="6" fill="#e0a64a"/><circle cx="736.0" cy="146.0" r="6" fill="#e0a64a"/><circle cx="743.0" cy="146.0" r="6" fill="#e0a64a"/><path d="M737.8 130.0L737.8 162.0" stroke="#e0a64a" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="745.8" y="176.0" font-size="11" font-weight="700" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a;stroke:var(--panel,#fff);stroke-width:4px;paint-order:stroke">mean 10.17</text><text x="40.0" y="217.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">accurate, not precise</text><path d="M399.9999999999998 212H889.9999999999999" stroke="#1d2733" stroke-width="1.5" opacity=".5"/><circle cx="508.5" cy="212.0" r="6" fill="#3f7fd6"/><circle cx="690.5" cy="212.0" r="6" fill="#3f7fd6"/><circle cx="631.0" cy="212.0" r="6" fill="#3f7fd6"/><circle cx="571.5" cy="212.0" r="6" fill="#3f7fd6"/><circle cx="729.0" cy="212.0" r="6" fill="#3f7fd6"/><circle cx="550.5" cy="212.0" r="6" fill="#3f7fd6"/><path d="M613.5 196.0L613.5 228.0" stroke="#3f7fd6" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="621.5" y="242.0" font-size="11" font-weight="700" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6;stroke:var(--panel,#fff);stroke-width:4px;paint-order:stroke">mean 9.81</text><text x="40.0" y="283.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">neither</text><path d="M399.9999999999998 278H889.9999999999999" stroke="#1d2733" stroke-width="1.5" opacity=".5"/><circle cx="648.5" cy="278.0" r="6" fill="#ef5b4c"/><circle cx="830.5" cy="278.0" r="6" fill="#ef5b4c"/><circle cx="771.0" cy="278.0" r="6" fill="#ef5b4c"/><circle cx="711.5" cy="278.0" r="6" fill="#ef5b4c"/><circle cx="869.0" cy="278.0" r="6" fill="#ef5b4c"/><circle cx="690.5" cy="278.0" r="6" fill="#ef5b4c"/><path d="M753.5 262.0L753.5 294.0" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="761.5" y="308.0" font-size="11" font-weight="700" text-anchor="start" class="sf-lab" fill="#1d