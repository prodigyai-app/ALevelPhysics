<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-label="A block on a 30 degree slope with its weight resolved into components along and into the slope, the normal contact force and friction" width="920" height="410" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="410" fill="#ffffff"/><defs></defs><text x="330.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">5.0 kg block sliding down a 30° slope</text><path d="M70 360H520.3332099679081V100.0Z" fill="#1d2733" fill-opacity=".08" stroke="#1d2733" stroke-width="2"/><path d="M140 360A70 70 0 0 0 130.6 325.0" fill="none" stroke="#1d2733" stroke-width="1.5"/><text x="150.0" y="348.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">θ = 30°</text><g transform="translate(313.8 182.3) rotate(-30)"><rect x="-46" y="-32" width="92" height="64" rx="4" fill="#e0a64a" fill-opacity=".6" stroke="#1d2733" stroke-width="1.6"/></g><path d="M313.8 182.3L313.8 288.0" stroke="#ef5b4c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M313.8 300.0L307.8 288.0L319.8 288.0Z" fill="#ef5b4c"/><text x="303.8" y="316.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">mg = 49.1 N</text><path d="M313.8 182.3L272.4 206.2" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M262.8 211.7L269.6 201.5L275.1 211.0Z" fill="#3f7fd6"/><text x="254.8" y="227.7" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">mg sin θ = 24.5 N</text><path d="M313.8 182.3L359.3 261.1" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M364.8 270.6L354.5 263.8L364.0 258.3Z" fill="#3f7fd6"/><text x="374.8" y="274.6" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">mg cos θ = 42.5 N</text><path d="M262.8 211.7L313.8 300.0" stroke="#3f7fd6" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M364.8 270.6L313.8 300.0" stroke="#3f7fd6" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M313.8 182.3L268.8 104.4" stroke="#3fb27f" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M262.8 94.0L274.0 101.4L263.6 107.4Z" fill="#3fb27f"/><text x="254.8" y="88.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">R = 42.5 N</text><path d="M373.1 181.0L412.6 158.2" stroke="#9b6bd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M423.0 152.2L415.6 163.4L409.6 153.0Z" fill="#9b6bd6"/><text x="429.0" y="146.2" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#9b6bd6">friction 10 N</text><text x="640.0" y="100.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Resolve the weight along</text><text x="640.0" y="120.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">and perpendicular to the slope:</text><text x="640.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">along: mg sin θ = 24.5 N</text><text x="640.0" y="160.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">into: mg cos θ = 42.5 N</text><text x="640.0" y="180.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="640.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">No motion into the slope:</text><text x="640.0" y="220.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">R = mg cos θ = 42.5 N</text><text x="640.0" y="240.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="640.0" y="260.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Along the slope, F = ma:</text><text x="640.0" y="280.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">24.5 − 10 = 5.0a</text><text x="640.0" y="300.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">a = 2.9 m s⁻²</text></svg>