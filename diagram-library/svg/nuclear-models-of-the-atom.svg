<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="How the model of the atom developed" width="960" height="360" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="360" fill="#ffffff"/><defs></defs><circle cx="160" cy="170" r="100" fill="#f7c8d8" opacity=".55" stroke="#c9879f" stroke-width="2"/><circle cx="165.3" cy="237.9" r="7" fill="#2f7fd6"/><circle cx="88.3" cy="142.6" r="7" fill="#2f7fd6"/><circle cx="223.3" cy="190.5" r="7" fill="#2f7fd6"/><circle cx="202.7" cy="189.4" r="7" fill="#2f7fd6"/><circle cx="86.1" cy="149.9" r="7" fill="#2f7fd6"/><circle cx="115.1" cy="132.2" r="7" fill="#2f7fd6"/><circle cx="89.9" cy="160.7" r="7" fill="#2f7fd6"/><circle cx="205.8" cy="144.7" r="7" fill="#2f7fd6"/><circle cx="137.9" cy="216.9" r="7" fill="#2f7fd6"/><circle cx="127.2" cy="152.5" r="7" fill="#2f7fd6"/><circle cx="141.6" cy="243.4" r="7" fill="#2f7fd6"/><circle cx="214.2" cy="200.3" r="7" fill="#2f7fd6"/><circle cx="144.7" cy="171.8" r="7" fill="#2f7fd6"/><circle cx="108.7" cy="217.8" r="7" fill="#2f7fd6"/><text x="160" y="40" text-anchor="middle" font-size="16" font-weight="700" class="sf-lab" fill="#1d2733">Plum pudding model</text><text x="160" y="300" text-anchor="middle" font-size="13" class="sf-lab" fill="#1d2733">A ball of positive charge</text><text x="160" y="318" text-anchor="middle" font-size="13" class="sf-lab" fill="#1d2733">with electrons embedded in it</text><circle cx="480" cy="170" r="100" fill="none" stroke="#1d2733" stroke-dasharray="3 5" opacity=".4"/><circle cx="480" cy="170" r="8" fill="#c8372a"/><circle cx="564.1" cy="190.7" r="6" fill="#2f7fd6"/><circle cx="499.3" cy="238.3" r="6" fill="#2f7fd6"/><circle cx="415.1" cy="217.3" r="6" fill="#2f7fd6"/><circle cx="396.2" cy="148.8" r="6" fill="#2f7fd6"/><circle cx="461.4" cy="101.6" r="6" fill="#2f7fd6"/><circle cx="545.4" cy="123.2" r="6" fill="#2f7fd6"/><text x="480" y="40" text-anchor="middle" font-size="16" font-weight="700" class="sf-lab" fill="#1d2733">Nuclear model (Rutherford)</text><text x="480" y="300" text-anchor="middle" font-size="13" class="sf-lab" fill="#1d2733">Tiny, dense positive nucleus;</text><text x="480" y="318" text-anchor="middle" font-size="13" class="sf-lab" fill="#1d2733">mostly empty space</text><circle cx="800" cy="170" r="40" fill="none" stroke="#1d2733" opacity=".5"/><circle cx="800" cy="170" r="70" fill="none" stroke="#1d2733" opacity=".5"/><circle cx="800" cy="170" r="100" fill="none" stroke="#1d2733" opacity=".5"/><circle cx="800" cy="170" r="10" fill="#c8372a"/><circle cx="800.0" cy="130.0" r="6" fill="#2f7fd6"/><circle cx="800.0" cy="210.0" r="6" fill="#2f7fd6"/><circle cx="870.0" cy="170.0" r="6" fill="#2f7fd6"/><circle cx="730.0" cy="170.0" r="6" fill="#2f7fd6"/><circle cx="870.7" cy="99.3" r="6" fill="#2f7fd6"/><text x="800" y="40" text-anchor="middle" font-size="16" font-weight="700" class="sf-lab" fill="#1d2733">Bohr model</text><text x="800" y="300" text-anchor="middle" font-size="13" class="sf-lab" fill="#1d2733">Electrons orbit at fixed</text><text x="800" y="318" text-anchor="middle" font-size="13" class="sf-lab" fill="#1d2733">distances (energy levels)</text><path d="M275 170h80M595 170h80" stroke="#1d2733" stroke-width="2.4"/><path d="M355 170l-10 -6v12zM675 170l-10 -6v12z" fill="#1d2733"/><text x="315" y="160" text-anchor="middle" font-size="11" class="sf-lab" fill="#1d2733">alpha</text><text x="315" y="190" text-anchor="middle" font-size="11" class="sf-lab" fill="#1d2733">scattering</text><text x="635" y="160" text-anchor="middle" font-size="11" class="sf-lab" fill="#1d2733">Bohr's</text><text x="635" y="190" text-anchor="middle" font-size="11" class="sf-lab" fill="#1d2733">calculations</text></svg>