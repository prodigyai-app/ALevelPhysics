uency changes</text><text x="640.0" y="146.0" font-size="15" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Δf ÷ f = 2 v cos θ ÷ c</text><text x="640.0" y="172.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">c = speed of ultrasound</text><text x="640.0" y="190.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">in tissue</text></svg>