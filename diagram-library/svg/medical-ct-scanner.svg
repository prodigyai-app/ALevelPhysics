<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-label="CAT scanner: rotating X-ray tube and detector ring around a patient" width="920" height="440" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="440" fill="#ffffff"/><defs></defs><circle cx="300" cy="236" r="150" fill="none" stroke="#7d858f" stroke-width="18"/><rect x="170" y="266" width="260" height="16" fill="#9aa3ad"/><ellipse cx="300" cy="250" rx="90" ry="22" fill="#e8c4a4"/><rect x="276" y="68" width="48" height="30" rx="5" fill="#3d4654"/><text x="300.0" y="58.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">X-ray tube</text><path d="M300 98L210 371H390Z" fill="#b07cff" opacity=".18"/><rect x="365.9" y="361.6" width="12" height="12" fill="#3fb27f"/><rect x="352.4" y="368.2" width="12" height="12" fill="#3fb27f"/><rect x="338.3" y="373.3" width="12" height="12" fill="#3fb27f"/><rect x="323.8" y="377.0" width="12" height="12" fill="#3fb27f"/><rect x="309.0" y="379.3" width="12" height="12" fill="#3fb27f"/><rect x="294.0" y="380.0" width="12" height="12" fill="#3fb27f"/><rect x="279.0" y="379.3" width="12" height="12" fill="#3fb27f"/><rect x="264.2" y="377.0" width="12" height="12" fill="#3fb27f"/><rect x="249.7" y="373.3" width="12" height="12" fill="#3fb27f"/><rect x="235.6" y="368.2" width="12" height="12" fill="#3fb27f"/><rect x="222.1" y="361.6" width="12" height="12" fill="#3fb27f"/><text x="300.0" y="422.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">detector array</text><text x="300.0" y="438.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">the tube and detectors rotate together</text><text x="520.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">thin fan-shaped X-ray beam</text><text x="520.0" y="170.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">many images from different angles</text><text x="520.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">a computer builds a 3D image</text><text x="520.0" y="220.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">slice by slice</text><text x="520.0" y="260.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">+ shows soft tissue in detail</text><text x="520.0" y="282.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">− higher dose than a single X-ray</text><text x="460.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Computerised axial tomography (CAT)</text></svg>