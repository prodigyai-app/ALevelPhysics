<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-label="A 9 volt supply across 20 and 40 ohm resistors in series, in parallel with 30 ohms, with every current and potential difference labelled" width="940" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="400" fill="#ffffff"/><defs></defs><text x="300.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Two branches across a 9.0 V supply</text><path d="M90 180V90H170V270M170 150H460M170 270H460M460 150V330H90V240" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><circle cx="170.0" cy="150.0" r="4.5" fill="#1d2733"/><circle cx="460.0" cy="270.0" r="4.5" fill="#1d2733"/><rect x="213.0" y="141.0" width="54" height="18" rx="2" fill="var(--panel,#fff)" fill-opacity=".9" stroke="#1d2733" stroke-width="2.2"/><text x="240.0" y="133.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">R₁ = 20 Ω</text><rect x="353.0" y="141.0" width="54" height="18" rx="2" fill="var(--panel,#fff)" fill-opacity=".9" stroke="#1d2733" stroke-width="2.2"/><text x="380.0" y="133.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">R₂ = 40 Ω</text><rect x="283.0" y="261.0" width="54" height="18" rx="2" fill="var(--panel,#fff)" fill-opacity=".9" stroke="#1d2733" stroke-width="2.2"/><text x="310.0" y="253.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">R₃ = 30 Ω</text><rect x="68" y="180" width="44" height="60" fill="var(--panel,#fff)" opacity="0"/><path d="M72.0 204.0L108.0 204.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M81.0 216.0L99.0 216.0" stroke="#1d2733" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M90.0 180.0L90.0 204.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M90.0 216.0L90.0 240.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="64.0" y="215.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">9.0 V</text><path d="M90.0 130.0L90.0 104.0" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M90.0 94.0L95.0 104.0L85.0 104.0Z" fill="#ef5b4c"/><text x="98.0" y="120.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">0.45 A</text><path d="M178.0 150.0L196.0 150.0" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M206.0 150.0L196.0 155.0L196.0 145.0Z" fill="#ef5b4c"/><text x="192.0" y="172.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">0.15 A</text><path d="M178.0 270.0L240.0 270.0" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M250.0 270.0L240.0 275.0L240.0 265.0Z" fill="#ef5b4c"/><text x="214.0" y="292.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">0.30 A</text><text x="240.0" y="194.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">3.0 V</text><text x="380.0" y="194.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">6.0 V</text><text x="310.0" y="314.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">9.0 V</text><text x="590.0" y="90.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">1  Each branch has the full 9.0 V</text><text x="590.0" y="110.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   branch 1: 20 + 40 = 60 Ω → 0.15 A</text><text x="590.0" y="130.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   branch 2: 9.0 ÷ 30 = 0.30 A</text><text x="590.0" y="150.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">2  Kirchhoff’s first law</text><text x="590.0" y="170.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   supply current = 0.15 + 0.30 = 0.45 A</text><text x="590.0" y="190.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   (check: R<tspan dy="0.32em" font-size="72%">total</tspan><tspan dy="-0.23em"> = 9.0 ÷ 0.45 = 20 Ω)</tspan></text><text x="590.0" y="210.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">3  Work back with V = IR</text><text x="590.0" y="230.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   V₁ = 0.15 × 20 = 3.0 V</text><text x="590.0" y="250.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   V₂ = 0.15 × 40 = 6.0 V</text><text x="590.0" y="270.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   3.0 + 6.0 = 9.0 V round each loop</text><text x="300.0" y="376.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">red: currents     blue: p.d.s</text></svg>