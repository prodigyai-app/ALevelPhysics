<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="PET scanner: positron annihilation producing two gamma photons detected by a ring" width="920" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="400" fill="#ffffff"/><defs></defs><circle cx="300" cy="210" r="150" fill="none" stroke="#3fb27f" stroke-width="16" stroke-dasharray="14 4"/><ellipse cx="300" cy="210" rx="80" ry="40" fill="#e8c4a4"/><circle cx="320" cy="204" r="6" fill="#ef5b4c"/><path d="M320.0 204.0L189.8 111.0" stroke="#b07cff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M180.0 104.0L193.3 106.1L186.3 115.9Z" fill="#b07cff"/><path d="M320.0 204.0L450.2 297.0" stroke="#b07cff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M460.0 304.0L446.7 301.9L453.7 292.1Z" fill="#b07cff"/><text x="172.0" y="98.0" font-size="16" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#b07cff">γ</text><text x="470.0" y="314.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#b07cff">γ</text><text x="470.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Positron emission tomography (PET)</text><text x="520.0" y="110.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">tracer (e.g. fluorine-18 in glucose)</text><text x="520.0" y="136.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">emits a positron β⁺</text><text x="520.0" y="162.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">positron meets an electron: annihilation</text><text x="520.0" y="188.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">two gamma photons, 511 keV each,</text><text x="520.0" y="214.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">travel in opposite directions</text><text x="520.0" y="240.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">detectors that fire at the same time</text><text x="520.0" y="266.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">locate the source along a line</text><text x="520.0" y="310.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">shows where cells are most active</text></svg>