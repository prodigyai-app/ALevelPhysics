<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-label="Hubble graph of recession speed against distance with gradient H0, and the separation of galaxies run backwards to zero at about 14 billion years ago" width="940" height="410" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="410" fill="#ffffff"/><defs></defs><path d="M100.0 301.4L520.0 301.4" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 301.4L100.0 301.4" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="305.4" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">5 000</text><path d="M100.0 262.9L520.0 262.9" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 262.9L100.0 262.9" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="266.9" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">10 000</text><path d="M100.0 224.3L520.0 224.3" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 224.3L100.0 224.3" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="228.3" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">15 000</text><path d="M100.0 185.7L520.0 185.7" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 185.7L100.0 185.7" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="189.7" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">20 000</text><path d="M100.0 147.1L520.0 147.1" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 147.1L100.0 147.1" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="151.1" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">25 000</text><path d="M100.0 108.6L520.0 108.6" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 108.6L100.0 108.6" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="112.6" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">30 000</text><path d="M100.0 70.0L520.0 70.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 70.0L100.0 70.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="74.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">35 000</text><path d="M184.0 70.0L184.0 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M184.0 340.0L184.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="184.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">100</text><path d="M268.0 70.0L268.0 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M268.0 340.0L268.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="268.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">200</text><path d="M352.0 70.0L352.0 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M352.0 340.0L352.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="352.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">300</text><path d="M436.0 70.0L436.0 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M436.0 340.0L436.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="436.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">400</text><path d="M520.0 70.0L520.0 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M520.0 340.0L520.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="520.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">500</text><path d="M100 70.0V340M100 340.0H520" stroke="#1d2733" stroke-width="2" fill="none"/><text x="310.0" y="384.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Distance d / Mpc</text><g transform="rotate(-90 38.0 205.0)"><text x="38.0" y="205.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Recession speed v / km s⁻¹</text></g><text x="320.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Hubble’s law: v = H₀d</text><path d="M100.0 340.0L520.0 70.0" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="133.6" cy="317.1" r="5" fill="#ef5b4c"/><circle cx="163.0" cy="302.7" r="5" fill="#ef5b4c"/><circle cx="200.8" cy="272.0" r="5" fill="#ef5b4c"/><circle cx="234.4" cy="256.2" r="5" fill="#ef5b4c"/><circle cx="272.2" cy="221.6" r="5" fill="#ef5b4c"/><circle cx="310.0" cy="211.8" r="5" fill="#ef5b4c"/><circle cx="343.6" cy="180.3" r="5" fill="#ef5b4c"/><circle cx="385.6" cy="167.4" r="5" fill="#ef5b4c"/><circle cx="423.4" cy="123.8" r="5" fill="#ef5b4c"/><circle cx="469.6" cy="107.2" r="5" fill="#ef5b4c"/><text x="310.0" y="104.7" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">gradient H₀ = 70 km s⁻¹ Mpc⁻¹</text><text x="310.0" y="122.7" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">(galaxy data: illustrative)</text><path d="M620.0 340.0L620.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="620.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">−15</text><path d="M713.3 340.0L713.3 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="713.3" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">−10</text><path d="M806.7 340.0L806.7 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="806.7" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">−5</text><path d="M900.0 340.0L900.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="900.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">0</text><path d="M620 110.0V340M620 340.0H900" stroke="#1d2733" stroke-width="2" fill="none"/><text x="760.0" y="384.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Time from now / billion years</text><g transform="rotate(-90 598.0 225.0)"><text x="598.0" y="225.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Separation (now = 1)</text></g><text x="760.0" y="72.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Run it backwards</text><path d="M639.2 340.0L900.0 148.3" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="639.2" cy="340.0" r="6" fill="#e0a64a"/><circle cx="900.0" cy="148.3" r="5" fill="#ef5b4c"/><path d="M641.2 334.0L646.1 244.2" stroke="#e0a64a" stroke-width="1.2" fill="none" stroke-linecap="round"/><text x="631.2" y="221.2" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">zero ≈ 14 billion</text><text x="631.2" y="237.2" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">years ago</text><text x="634.0" y="140.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">if speeds were constant,</text><text x="634.0" y="157.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">every separation reaches</text><text x="634.0" y="174.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">zero at t = 1 ÷ H₀</text><text x="634.0" y="191.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">1 ÷ H₀ = 4.41 × 10¹⁷ s</text></svg>