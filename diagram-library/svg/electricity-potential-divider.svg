<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="A potential divider and a thermistor sensing circuit" width="960" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="420" fill="#ffffff"/><defs></defs><text x="230.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Potential divider</text><text x="230.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">the p.d. is shared in the ratio of the resistances</text><text x="700.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Sensing circuit</text><text x="700.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">output changes with temperature or light</text><path d="M100 100H200V148M200 282V340H100V100" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="86" y="200" width="28" height="30" fill="#ffffff"/><path d="M80 210H120M88 222H112" stroke="#1d2733" stroke-width="3.5"/><rect x="191" y="148" width="18" height="44" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><rect x="191" y="238" width="18" height="44" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><path d="M200 192V238" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><text x="178.0" y="170.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">R₁</text><text x="178.0" y="260.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">R₂</text><text x="70.0" y="220.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733">V_in</text><path d="M200 215H300M200 340H300" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><circle cx="300" cy="215" r="4" fill="#1d2733"/><circle cx="300" cy="340" r="4" fill="#1d2733"/><path d="M320.0 277.5L320.0 325.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M320.0 335.0L315.0 325.0L325.0 325.0Z" fill="#1d2733"/><path d="M320.0 277.5L320.0 230.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M320.0 220.0L325.0 230.0L315.0 230.0Z" fill="#1d2733"/><text x="330.0" y="282.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">V_out</text><text x="230.0" y="396.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">V_out = V_in × R₂ ÷ (R₁ + R₂)</text><path d="M570 100H670V148M670 282V340H570V100" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="556" y="200" width="28" height="30" fill="#ffffff"/><path d="M550 210H590M558 222H582" stroke="#1d2733" stroke-width="3.5"/><rect x="661" y="148" width="18" height="44" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><path d="M670 192V238" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="661" y="238" width="18" height="44" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><path d="M652 280L688 240" stroke="#1d2733" stroke-width="2"/><path d="M652 280h-8" stroke="#1d2733" stroke-width="2"/><text x="648.0" y="170.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">fixed R</text><text x="648.0" y="266.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">thermistor</text><path d="M670 215H760M670 340H760" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="760" y="230" width="60" height="90" rx="6" fill="#3d4654"/><text x="790.0" y="280.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#e8ecf5">to</text><text x="790.0" y="296.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#e8ecf5">alarm</text><text x="700.0" y="380.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">hotter → thermistor R falls → V_out across it falls</text><text x="700.0" y="398.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">(an LDR works the same way with light)</text></svg>