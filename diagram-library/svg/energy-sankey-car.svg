<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Sankey diagram with 50 kilowatts of fuel power in, 15 kilowatts useful and 35 kilowatts wasted, drawn to scale" width="920" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="400" fill="#ffffff"/><defs></defs><text x="460.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Car at 25 m s⁻¹: engine 30 % efficient</text><path d="M60 80H760l34 24.0l-34 24.0H60Z" fill="#3fb27f" fill-opacity=".8"/><path d="M60 128.0H380A142.0 142.0 0 0 1 522.0 270.0V296.0L466.0 318.0L410.0 296.0V270.0A30 30 0 0 0 380 240.0H60Z" fill="#ef5b4c" fill-opacity=".75"/><text x="72.0" y="165.0" font-size="15" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">fuel: 50 kW in</text><text x="806.0" y="102.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">useful: 15 kW</text><text x="806.0" y="120.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">P = Fv = 600 × 25</text><text x="466.0" y="340.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">wasted: 35 kW</text><text x="466.0" y="358.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">heating the engine, exhaust and air</text><text x="580.0" y="190.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">efficiency = useful ÷ total input</text><text x="580.0" y="210.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">= 15 ÷ 50 = 0.30 = 30 %</text><text x="580.0" y="230.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="580.0" y="250.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">input power = 15 kW ÷ 0.30 = 50 kW</text><text x="580.0" y="270.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">band widths drawn to scale</text></svg>