<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-label="An alpha particle approaching a gold nucleus head-on to a distance of closest approach, and a straight-line graph of nuclear radius against the cube root of nucleon number" width="940" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="420" fill="#ffffff"/><defs></defs><text x="230.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Closest approach of an alpha particle</text><circle cx="380" cy="190" r="16" fill="#ef5b4c"/><text x="380.0" y="195.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">Au</text><text x="380.0" y="228.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">gold nucleus, +79e</text><path d="M60.0 186.0L258.0 186.0" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M270.0 186.0L258.0 192.0L258.0 180.0Z" fill="#3f7fd6"/><path d="M270.0 196.0L90.0 196.0" stroke="#3f7fd6" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M80.0 196.0L90.0 191.0L90.0 201.0Z" fill="#3f7fd6"/><circle cx="282" cy="190" r="8" fill="#3f7fd6"/><text x="160.0" y="172.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">5.0 MeV alpha, head-on</text><path d="M335.0 250.0L370.0 250.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M380.0 250.0L370.0 255.0L370.0 245.0Z" fill="#1d2733"/><path d="M335.0 250.0L300.0 250.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M290.0 250.0L300.0 245.0L300.0 255.0Z" fill="#1d2733"/><text x="335.0" y="270.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">d = 45 fm</text><text x="40.0" y="300.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">All kinetic energy → electric potential energy:</text><text x="40.0" y="319.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">E<tspan dy="0.32em" font-size="72%">k</tspan><tspan dy="-0.23em"> = kQq ÷ d</tspan></text><text x="40.0" y="338.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">d = (8.99 × 10⁹ × 79e × 2e) ÷ (5.0 MeV) = 45 fm</text><text x="40.0" y="357.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">This is an upper limit for the radius. R(gold) = 1.2 × ∛197 = 7.0 fm.</text><text x="40.0" y="376.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Electron diffraction gives the radius more directly.</text><path d="M560.0 270.0L890.0 270.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M555.0 270.0L560.0 270.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="551.0" y="274.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">2</text><path d="M560.0 210.0L890.0 210.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M555.0 210.0L560.0 210.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="551.0" y="214.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">4</text><path d="M560.0 150.0L890.0 150.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M555.0 150.0L560.0 150.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="551.0" y="154.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">6</text><path d="M560.0 90.0L890.0 90.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M555.0 90.0L560.0 90.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="551.0" y="94.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">8</text><path d="M607.1 90.0L607.1 330.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M607.1 330.0L607.1 335.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="607.1" y="349.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">1</text><path d="M654.3 90.0L654.3 330.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M654.3 330.0L654.3 335.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="654.3" y="349.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">2</text><path d="M701.4 90.0L701.4 330.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M701.4 330.0L701.4 335.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="701.4" y="349.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">3</text><path d="M748.6 90.0L748.6 330.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M748.6 330.0L748.6 335.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="748.6" y="349.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">4</text><path d="M795.7 90.0L795.7 330.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M795.7 330.0L795.7 335.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="795.7" y="349.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">5</text><path d="M842.9 90.0L842.9 330.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M842.9 330.0L842.9 335.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="842.9" y="349.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">6</text><path d="M890.0 90.0L890.0 330.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M890.0 330.0L890.0 335.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="890.0" y="349.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">7</text><path d="M560 90.0V330M560 330.0H890" stroke="#1d2733" stroke-width="2" fill="none"/><text x="725.0" y="374.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">∛A  (cube root of nucleon number)</text><g transform="rotate(-90 522.0 210.0)"><text x="522.0" y="210.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Radius R / fm</text></g><text x="730.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">R = r₀ ∛A with r₀ = 1.2 fm</text><path d="M560.0 330.0L871.1 92.4" stroke="#3f7fd6" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="667.9" cy="247.6" r="5" fill="#ef5b4c"/><text x="675.9" y="262.6" font-size="11" text-anchor="start" class="sf-lab" fill="#1d2733">C-12</text><circle cx="678.8" cy="239.3" r="5" fill="#ef5b4c"/><text x="670.8" y="233.3" font-size="11" text-anchor="end" class="sf-lab" fill="#1d2733">O-16</text><circle cx="721.2" cy="206.9" r="5" fill="#ef5b4c"/><text x="729.2" y="221.9" font-size="11" text-anchor="start" class="sf-lab" fill="#1d2733">Ca-40</text><circle cx="740.4" cy="192.3" r="5" fill="#ef5b4c"/><text x="732.4" y="186.3" font-size="11" text-anchor="end" class="sf-lab" fill="#1d2733">Fe-56</text><circle cx="792.5" cy="152.4" r="5" fill="#ef5b4c"/><text x="800.5" y="167.4" font-size="11" text-anchor="start" class="sf-lab" fill="#1d2733">Sn-120</text><circle cx="839.3" cy="116.7" r="5" fill="#ef5b4c"/><text x="831.3" y="110.7" font-size="11" text-anchor="end" class="sf-lab" fill="#1d2733">Pb-208</text><circle cx="852.2" cy="106.9" r="5" fill="#ef5b4c"/><text x="860.2" y="121.9" font-size="11" text-anchor="start" class="sf-lab" fill="#1d2733">U-238</text><text x="730.0" y="395.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">nuclear density = u ÷ (⁴⁄₃πr₀³) ≈ 2.3 × 10¹⁷ kg m⁻³ for every nucleus</text><text x="730.0" y="413.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">(water: 1.0 × 10³ kg m⁻³, so about 10¹⁴ times denser)</text></svg>