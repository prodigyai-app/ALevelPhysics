<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-label="Rutherford alpha-particle scattering apparatus and the paths of alpha particles near a nucleus" width="980" height="440" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="980" height="440" fill="#ffffff"/><defs></defs><circle cx="280" cy="230" r="170" fill="#e8f3f8" fill-opacity=".06" stroke="#a9c4d4" stroke-width="3"/><text x="280.0" y="420.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">evacuated chamber (alpha particles would be absorbed by air)</text><rect x="90" y="206" width="70" height="48" fill="#6b7480" stroke="#3d4654"/><rect x="146" y="224" width="14" height="12" fill="#1f2227"/><text x="84.0" y="224.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">alpha</text><text x="84.0" y="240.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">source</text><path d="M160 230H272" stroke="#e0a64a" stroke-width="3"/><rect x="274" y="170" width="6" height="120" fill="#e8c35a"/><text x="277.0" y="160.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">gold foil</text><path d="M280 230L440 230M280 230L436 196M280 230L380 330M280 230L176 150" stroke="#e0a64a" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M280 230L420 110" stroke="#9aa3ad" stroke-width="6"/><rect x="408" y="88" width="40" height="34" rx="5" fill="#3d4654" transform="rotate(-40 428 105)"/><text x="470.0" y="90.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">detector (or microscope with a</text><text x="470.0" y="106.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">zinc sulfide screen) on a rotating arm</text><circle cx="760" cy="230" r="10" fill="#ef5b4c"/><text x="776.0" y="216.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">nucleus</text><path d="M560 140H940" stroke="#e0a64a" stroke-width="1.8"/><path d="M560 180H940" stroke="#e0a64a" stroke-width="1.8"/><path d="M560 280H940" stroke="#e0a64a" stroke-width="1.8"/><path d="M560 320H940" stroke="#e0a64a" stroke-width="1.8"/><path d="M560 360H940" stroke="#e0a64a" stroke-width="1.8"/><path d="M560 210H700Q745 208 770 170L860 60" stroke="#e0a64a" stroke-width="1.8" fill="none"/><path d="M560 254H690Q730 256 760 280L900 350" stroke="#e0a64a" stroke-width="1.8" fill="none"/><path d="M560 233H735Q748 233 735 238L560 270" stroke="#ef5b4c" stroke-width="2" fill="none"/><text x="750.0" y="40.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">What the results show</text><text x="750.0" y="380.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">most pass straight through: the atom is mostly empty space</text><text x="750.0" y="396.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">some deflect: the nucleus is positive</text><text x="750.0" y="412.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">very few bounce back: the nucleus is tiny and dense</text></svg>