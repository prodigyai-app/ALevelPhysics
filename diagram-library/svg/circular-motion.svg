<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="An object in circular motion with velocity along the tangent and force towards the centre" width="900" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><defs></defs><circle cx="260" cy="200" r="130" fill="none" stroke="#1d2733" stroke-dasharray="5 6" opacity=".6"/><circle cx="260" cy="200" r="5" fill="#1d2733"/><path d="M260 200L359.4 116.3" stroke="#d6d9de" stroke-width="2"/><circle cx="359.4" cy="116.3" r="14" fill="#9aa3ad"/><path d="M359.4 116.3L409.7 175.9" stroke="#3fb27f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M417.4 185.1L405.1 179.8L414.3 172.0Z" fill="#3fb27f"/><path d="M359.4 116.3L315.1 153.6" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M305.9 161.3L311.2 149.0L318.9 158.2Z" fill="#ef5b4c"/><text x="429.4" y="186.3" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">v (tangent)</text><text x="304.0" y="146.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">F (to centre)</text><path d="M300 200A40 40 0 0 0 290.6 174.2" stroke="#e0a64a" stroke-width="2" fill="none"/><text x="310.0" y="192.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">θ</text><text x="640.0" y="90.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">ω = θ ÷ t = 2π ÷ T = 2π f</text><text x="640.0" y="120.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">v = ω r</text><text x="640.0" y="160.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">a = v² ÷ r = ω² r</text><text x="640.0" y="190.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">F = m v² ÷ r</text><text x="640.0" y="240.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">speed constant, direction changes:</text><text x="640.0" y="258.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">it accelerates towards the centre</text><text x="450.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Circular motion</text></svg>