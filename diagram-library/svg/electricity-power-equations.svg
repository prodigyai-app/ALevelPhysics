<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="The power equations P equals VI, I squared R and V squared over R linked through V equals IR, with a kettle example" width="920" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="380" fill="#ffffff"/><defs></defs><text x="460.0" y="28.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Three forms of the power equation</text><circle cx="300" cy="190" r="46" fill="#e0a64a" fill-opacity=".9"/><text x="300.0" y="202.0" font-size="34" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">P</text><path d="M300.0 144.0L300.0 116.0" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/><rect x="220.0" y="72.0" width="160.0" height="44.0" rx="8" fill="#3f7fd6" fill-opacity="0.14" stroke="#3f7fd6" stroke-width="1.6"/><text x="300.0" y="101.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">P = VI</text><text x="300.0" y="62.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">definition: energy per coulomb × coulombs per second</text><path d="M260.7 214.0L159.3 276.0" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/><rect x="40.0" y="276.0" width="160.0" height="44.0" rx="8" fill="#3f7fd6" fill-opacity="0.14" stroke="#3f7fd6" stroke-width="1.6"/><text x="120.0" y="305.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">P = I²R</text><text x="120.0" y="340.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">put V = IR: use when you know I</text><path d="M339.3 214.0L440.7 276.0" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/><rect x="400.0" y="276.0" width="160.0" height="44.0" rx="8" fill="#3f7fd6" fill-opacity="0.14" stroke="#3f7fd6" stroke-width="1.6"/><text x="480.0" y="305.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">P = V² ÷ R</text><text x="480.0" y="340.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">put I = V ÷ R: use when you know V</text><circle cx="300" cy="190" r="46" fill="#e0a64a"/><text x="300.0" y="202.0" font-size="34" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">P</text><rect x="620.0" y="70.0" width="270.0" height="250.0" rx="8" fill="#3fb27f" fill-opacity="0.08" stroke="#3fb27f" stroke-width="1.6"/><text x="636.0" y="96.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Kettle: 2.8 kW on 230 V mains</text><text x="636.0" y="118.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">I = P ÷ V = 12.2 A</text><text x="636.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">R = V² ÷ P = 18.9 Ω</text><text x="636.0" y="162.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">check: I²R = 2800 W</text><text x="636.0" y="184.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="636.0" y="206.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">3.0 minutes:</text><text x="636.0" y="228.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">W = Pt = 2800 × 180 = 5.04 × 10⁵ J</text><text x="636.0" y="250.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">= 2.8 kW × 0.050 h = 0.14 kWh</text><text x="636.0" y="272.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">cost at 25p per kWh = 3.5p</text></svg>