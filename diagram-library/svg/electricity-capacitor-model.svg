<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-label="Iterative model of capacitor discharge compared with the exponential curve" width="940" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="400" fill="#ffffff"/><defs></defs><path d="M90 70V330H570" stroke="#1d2733" stroke-width="2.5" fill="none"/><path d="M90.0 80.0L90.0 74.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M90.0 64.0L95.0 74.0L85.0 74.0Z" fill="#1d2733"/><path d="M560.0 330.0L566.0 330.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M576.0 330.0L566.0 335.0L566.0 325.0Z" fill="#1d2733"/><text x="330.0" y="364.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Time t</text><text x="104.0" y="74.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">Charge Q</text><path d="M90.0 90.0L96.0 97.1L102.0 104.0L108.0 110.7L114.0 117.1L120.0 123.4L126.0 129.5L132.0 135.5L138.0 141.2L144.0 146.8L150.0 152.2L156.0 157.5L162.0 162.6L168.0 167.5L174.0 172.3L180.0 177.0L186.0 181.5L192.0 185.9L198.0 190.1L204.0 194.3L210.0 198.3L216.0 202.2L222.0 206.0L228.0 209.6L234.0 213.2L240.0 216.6L246.0 220.0L252.0 223.2L258.0 226.4L264.0 229.5L270.0 232.4L276.0 235.3L282.0 238.1L288.0 240.8L294.0 243.5L300.0 246.0L306.0 248.5L312.0 250.9L318.0 253.2L324.0 255.5L330.0 257.7L336.0 259.8L342.0 261.9L348.0 263.9L354.0 265.9L360.0 267.8L366.0 269.6L372.0 271.4L378.0 273.1L384.0 274.8L390.0 276.4L396.0 278.0L402.0 279.6L408.0 281.1L414.0 282.5L420.0 283.9L426.0 285.3L432.0 286.6L438.0 287.9L444.0 289.1L450.0 290.3L456.0 291.5L462.0 292.6L468.0 293.7L474.0 294.8L480.0 295.9L486.0 296.9L492.0 297.8L498.0 298.8L504.0 299.7L510.0 300.6L516.0 301.5L522.0 302.3L528.0 303.1L534.0 303.9L540.0 304.7L546.0 305.5L552.0 306.2L558.0 306.9L564.0 307.6L570.0 308.2" stroke="#3f7fd6" stroke-width="3" fill="none"/><path d="M90 90H130V138.0H170V176.4H210V207.1H250V231.7H290V251.4H330V267.1H370V279.7H410V289.7H450V297.8H490V304.2H530V309.4H570V313.5" stroke="#e0a64a" stroke-width="2" fill="none"/><text x="390.0" y="120.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">smooth curve: Q = Q₀ e^(−t/RC)</text><text x="390.0" y="146.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">steps: iterative model</text><text x="720.0" y="220.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Each step of Δt:</text><text x="620.0" y="246.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">I = Q ÷ RC</text><text x="620.0" y="268.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">ΔQ = −I Δt</text><text x="620.0" y="290.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">new Q = Q + ΔQ</text><text x="620.0" y="316.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">smaller Δt → closer to the curve</text><text x="470.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Modelling capacitor discharge</text></svg>