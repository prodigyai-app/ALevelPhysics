<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Redshift of spectral lines and the Hubble’s law graph of velocity against distance" width="960" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><defs></defs><text x="240.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Redshift</text><text x="240.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">lines from distant galaxies move to longer wavelengths</text><text x="710.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Hubble's law</text><text x="710.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">v = H₀ d</text><defs><linearGradient id="rsg"><stop offset="0" stop-color="#8a2aff"/><stop offset=".3" stop-color="#2a8aff"/><stop offset=".55" stop-color="#3ad04a"/><stop offset=".75" stop-color="#ffd02a"/><stop offset="1" stop-color="#ff2a2a"/></linearGradient></defs><rect x="60" y="100" width="360" height="40" fill="url(#rsg)"/><rect x="140" y="100" width="4" height="40" fill="#05070c"/><rect x="210" y="100" width="4" height="40" fill="#05070c"/><rect x="310" y="100" width="4" height="40" fill="#05070c"/><text x="240.0" y="158.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">lab (or the Sun)</text><rect x="60" y="200" width="360" height="40" fill="url(#rsg)"/><rect x="190" y="200" width="4" height="40" fill="#05070c"/><rect x="260" y="200" width="4" height="40" fill="#05070c"/><rect x="360" y="200" width="4" height="40" fill="#05070c"/><text x="240.0" y="258.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">distant galaxy: shifted towards red</text><text x="240.0" y="320.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">z = Δλ ÷ λ ≈ v ÷ c</text><path d="M520 110V340H900" stroke="#1d2733" stroke-width="2.5" fill="none"/><path d="M520.0 120.0L520.0 114.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M520.0 104.0L525.0 114.0L515.0 114.0Z" fill="#1d2733"/><path d="M890.0 340.0L896.0 340.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M906.0 340.0L896.0 345.0L896.0 335.0Z" fill="#1d2733"/><text x="710.0" y="374.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Distance d (Mpc)</text><text x="534.0" y="114.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">Recession velocity v</text><circle cx="548.0" cy="331.1" r="4" fill="#3f7fd6"/><circle cx="576.0" cy="302.2" r="4" fill="#3f7fd6"/><circle cx="604.0" cy="287.8" r="4" fill="#3f7fd6"/><circle cx="632.0" cy="263.3" r="4" fill="#3f7fd6"/><circle cx="660.0" cy="269.5" r="4" fill="#3f7fd6"/><circle cx="688.0" cy="235.8" r="4" fill="#3f7fd6"/><circle cx="716.0" cy="235.4" r="4" fill="#3f7fd6"/><circle cx="744.0" cy="211.5" r="4" fill="#3f7fd6"/><circle cx="772.0" cy="187.5" r="4" fill="#3f7fd6"/><circle cx="800.0" cy="162.7" r="4" fill="#3f7fd6"/><circle cx="828.0" cy="151.9" r="4" fill="#3f7fd6"/><circle cx="856.0" cy="139.1" r="4" fill="#3f7fd6"/><path d="M520 340L880 124" stroke="#ef5b4c" stroke-width="2.5"/><text x="730.0" y="180.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">gradient = H₀</text><text x="710.0" y="390.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">age of the universe ≈ 1 ÷ H₀; evidence for the Big Bang</text></svg>