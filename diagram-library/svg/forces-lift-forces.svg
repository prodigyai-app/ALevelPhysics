<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-label="Free-body diagram of a person in a lift accelerating upwards, and a trolley pulled by a hanging mass with tension and weight labelled" width="940" height="430" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="430" fill="#ffffff"/><defs></defs><text x="230.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Person on scales in a lift</text><text x="700.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Trolley pulled by a hanging mass</text><rect x="50.0" y="60.0" width="170.0" height="300.0" rx="6" fill="#1d2733" fill-opacity="0.05" stroke="#1d2733" stroke-width="1.6"/><path d="M135.0 60.0L135.0 46.0" stroke="#8a94a0" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="85" y="330" width="100" height="14" rx="3" fill="#8a94a0"/><text x="135.0" y="372.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">scales</text><circle cx="135" cy="150" r="18" fill="#e0a64a"/><rect x="113" y="170" width="44" height="100" rx="14" fill="#e0a64a"/><rect x="117" y="262" width="14" height="68" rx="5" fill="#e0a64a"/><rect x="139" y="262" width="14" height="68" rx="5" fill="#e0a64a"/><text x="300.0" y="62.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">free-body diagram</text><circle cx="300.0" cy="210.0" r="7" fill="#1d2733"/><path d="M300.0 202.0L300.0 106.4" stroke="#3f7fd6" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M300.0 94.4L306.0 106.4L294.0 106.4Z" fill="#3f7fd6"/><text x="312.0" y="106.4" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">R = 771 N</text><path d="M300.0 218.0L300.0 301.1" stroke="#ef5b4c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M300.0 313.1L294.0 301.1L306.0 301.1Z" fill="#ef5b4c"/><text x="312.0" y="309.1" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">W = mg = 687 N</text><path d="M250.0 250.0L250.0 182.0" stroke="#3fb27f" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M250.0 170.0L256.0 182.0L244.0 182.0Z" fill="#3fb27f"/><text x="250.0" y="274.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">a = 1.2</text><text x="250.0" y="290.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">m s⁻² up</text><text x="40.0" y="398.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">up positive:  R − W = ma</text><text x="40.0" y="417.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">R = 70 × (9.81 + 1.2) = 771 N: the scales read more than your weight</text><rect x="480" y="190" width="350" height="18" fill="#1d2733" fill-opacity=".15" stroke="#1d2733" stroke-width="1.5"/><rect x="486" y="208" width="14" height="150" fill="#1d2733" fill-opacity=".12"/><circle cx="838" cy="182" r="14" fill="none" stroke="#1d2733" stroke-width="2.5"/><circle cx="838" cy="182" r="3" fill="#1d2733"/><rect x="560.0" y="130.0" width="130" height="46" rx="5" fill="#3f7fd6" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="588.6" cy="183.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="661.4" cy="183.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="625.0" y="158.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1.5 kg</text><path d="M690.0 168.0L838.0 168.0" stroke="#1d2733" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M852.0 182.0L852.0 270.0" stroke="#1d2733" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="830" y="270" width="44" height="40" rx="4" fill="#9b6bd6"/><text x="852.0" y="295.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">0.50 kg</text><path d="M700.0 150.0L758.0 150.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M770.0 150.0L758.0 156.0L758.0 144.0Z" fill="#ef5b4c"/><text x="735.0" y="140.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">T = 3.7 N</text><path d="M852.0 262.0L852.0 226.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M852.0 214.0L858.0 226.0L846.0 226.0Z" fill="#ef5b4c"/><text x="864.0" y="238.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">T</text><path d="M852.0 312.0L852.0 368.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M852.0 380.0L846.0 368.0L858.0 368.0Z" fill="#ef5b4c"/><text x="864.0" y="362.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">W = 4.9 N</text><path d="M560.0 120.0L628.0 120.0" stroke="#3fb27f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M640.0 120.0L628.0 126.0L628.0 114.0Z" fill="#3fb27f"/><text x="600.0" y="110.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">a = 2.45 m s⁻²</text><path d="M800.0 330.0L800.0 368.0" stroke="#3fb27f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M800.0 380.0L794.0 368.0L806.0 368.0Z" fill="#3fb27f"/><text x="790.0" y="362.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">a</text><text x="520.0" y="252.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">whole system:</text><text x="520.0" y="270.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">a = 0.50 × 9.81 ÷ (1.5 + 0.50)</text><text x="520.0" y="288.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   = 2.45 m s⁻²</text><text x="520.0" y="306.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">trolley alone:</text><text x="520.0" y="324.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">T = 1.5 × 2.45 = 3.7 N</text></svg>