<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-label="Photoelectric effect with a gold-leaf electroscope, and finding the Planck constant with LEDs" width="980" height="440" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="980" height="440" fill="#ffffff"/><defs></defs><text x="250.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Gold-leaf electroscope</text><text x="250.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">a negatively charged zinc plate</text><text x="740.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Planck constant from LEDs</text><text x="740.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">eV = h c ÷ λ</text><path d="M180 200V330Q180 350 200 350H300Q320 350 320 330V200Q320 180 300 180H200Q180 180 180 200Z" fill="#e8f3f8" fill-opacity=".12" stroke="#a9c4d4" stroke-width="3"/><rect x="244" y="150" width="12" height="30" fill="#c9ccd2"/><rect x="200" y="130" width="100" height="20" fill="#9aa3ad" stroke="#6b7480"/><path d="M250 180V290" stroke="#e0b64a" stroke-width="4"/><path d="M250 250L262 300" stroke="#f4d36a" stroke-width="3"/><rect x="60" y="80" width="70" height="40" rx="6" fill="#3d4654"/><path d="M130 100L200 132" stroke="#b07cff" stroke-width="3" stroke-dasharray="6 5"/><text x="95.0" y="140.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">UV lamp</text><text x="210.0" y="126.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">−</text><text x="250.0" y="126.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">−</text><text x="290.0" y="126.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">−</text><path d="M220.0 126.0L228.1 96.7" stroke="#5aa9f0" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M230.0 90.0L231.5 97.7L224.8 95.8Z" fill="#5aa9f0"/><path d="M250.0 126.0L258.1 96.7" stroke="#5aa9f0" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M260.0 90.0L261.5 97.7L254.8 95.8Z" fill="#5aa9f0"/><path d="M280.0 126.0L288.1 96.7" stroke="#5aa9f0" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M290.0 90.0L291.5 97.7L284.8 95.8Z" fill="#5aa9f0"/><text x="310.0" y="84.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#5aa9f0">photoelectrons</text><text x="250.0" y="380.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">UV: leaf falls (electrons emitted at once).</text><text x="250.0" y="396.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">Bright visible light: nothing happens.</text><text x="250.0" y="412.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Threshold frequency: hf = φ + KEmax</text><path d="M600 120H880V300H600Z" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="726" y="104" width="28" height="32" fill="#ffffff"/><path d="M734 92V128M746 100V120" stroke="#1d2733" stroke-width="3.5"/><rect x="584" y="190" width="32" height="50" fill="#ffffff"/><rect x="591" y="193" width="18" height="44" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><path d="M582.0 244.0L617.5 192.6" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M622.0 186.0L620.8 194.9L614.2 190.3Z" fill="#1d2733"/><rect x="716" y="282" width="48" height="36" fill="#ffffff"/><path d="M728 288V312L752 300Z" fill="#ef5b4c"/><path d="M752 288V312" stroke="#1d2733" stroke-width="3"/><path d="M744.0 284.0L756.0 270.5" stroke="#ef5b4c" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M760.0 266.0L758.3 272.5L753.8 268.5Z" fill="#ef5b4c"/><path d="M754.0 290.0L766.0 276.5" stroke="#ef5b4c" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M770.0 272.0L768.3 278.5L763.8 274.5Z" fill="#ef5b4c"/><path d="M700 300V350H725M755 350H780V300" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><circle cx="740" cy="350" r="15" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><text x="740.0" y="356.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">V</text><circle cx="880" cy="210" r="15" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><text x="880.0" y="216.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">A</text><text x="740.0" y="396.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">increase V until each LED just lights;</text><text x="740.0" y="412.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">plot V against 1/λ: gradient = h c ÷ e</text><circle cx="640" cy="80" r="7" fill="#ef5b4c"/><circle cx="662" cy="80" r="7" fill="#f5a524"/><circle cx="684" cy="80" r="7" fill="#3fb27f"/><circle cx="706" cy="80" r="7" fill="#3f7fd6"/><text x="740.0" y="84.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">LEDs of known λ</text></svg>