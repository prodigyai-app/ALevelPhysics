d2733">one loop</text><text x="250.0" y="404.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">Same current everywhere; the supply p.d. is shared</text><text x="250.0" y="422.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">R total = R₁ + R₂</text><path d="M560 120H900V320H560Z" stroke="#1d2733" stroke-width="2.5" fill="none"/><path d="M640 120V320M820 120V320" stroke="none"/><path d="M600 220H860" stroke="none"/><rect x="716" y="104" width="28" height="32" fill="#ffffff"/><path d="M724 102V138M736 110V130" stroke="#1d2733" stroke-width="3.5"/><path d="M560 220H900" stroke="#1d2733" stroke-width="2.5"/><rect x="713" y="200" width="34" height="40" fill="#ffffff"/><circle cx="730" cy="220" r="15" fill="#fff6c8" stroke="#1d2733" stroke-width="2.5"/><path d="M720 210L740 230M740 210L720 230" stroke="#3a3f47" stroke-width="2"/><rect x="713" y="300" width="34" height="40" fill="#ffffff"/><circle cx="730" cy="320" r="15" fill="#fff6c8" stroke="#1d2733" stroke-width="2.5"/><path d="M720 310L740 330M740 310L720 330" stroke="#3a3f47" stroke-width="2"/><circle cx="620" cy="220" r="15" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><text x="620.0" y="226.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">A</text><circle cx="620" cy="320" r="15" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><text x="620.0" y="326.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">A</text><circle cx="560" cy="170" r="15" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><text x="560.0" y="176.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">A</text><text x="730.0" y="50.0" font-size="17" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Parallel circuit</text><text x="730.0" y="72.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">separate branches</text><text x="730.0" y="404.0" font-size="13" text-a