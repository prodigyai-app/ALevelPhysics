<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-label="Capacitor plates carrying equal and opposite charge, with 2 and 3 microfarad capacitors combined in series and in parallel across 10 volts" width="940" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="420" fill="#ffffff"/><defs></defs><text x="190.0" y="28.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Equal and opposite charges</text><rect x="90" y="70" width="16" height="170" fill="#ef5b4c" fill-opacity=".85"/><rect x="214" y="70" width="16" height="170" fill="#3f7fd6" fill-opacity=".85"/><rect x="106" y="70" width="108" height="170" fill="#1d2733" fill-opacity=".06"/><text x="98.0" y="92.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">+</text><text x="222.0" y="92.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">−</text><text x="98.0" y="119.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">+</text><text x="222.0" y="119.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">−</text><text x="98.0" y="146.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">+</text><text x="222.0" y="146.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">−</text><text x="98.0" y="173.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">+</text><text x="222.0" y="173.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">−</text><text x="98.0" y="200.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">+</text><text x="222.0" y="200.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">−</text><text x="98.0" y="227.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">+</text><text x="222.0" y="227.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">−</text><text x="160.0" y="160.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">insulator</text><text x="160.0" y="176.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">(dielectric)</text><text x="98.0" y="262.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">+Q</text><text x="222.0" y="262.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">−Q</text><path d="M98 70V46H150M170 46H222V70" stroke="#1d2733" stroke-width="2.2" fill="none"/><path d="M152.0 36.0L152.0 56.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M166.0 40.0L166.0 52.0" stroke="#1d2733" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M60.0 120.0L60.0 191.0" stroke="#3f7fd6" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M60.0 200.0L55.5 191.0L64.5 191.0Z" fill="#3f7fd6"/><text x="54.0" y="166.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">e⁻</text><path d="M262.0 200.0L262.0 129.0" stroke="#3f7fd6" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M262.0 120.0L266.5 129.0L257.5 129.0Z" fill="#3f7fd6"/><text x="268.0" y="166.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">e⁻</text><text x="40.0" y="300.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">electrons leave one plate and flow onto</text><text x="40.0" y="320.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">the other; no charge crosses the gap</text><text x="40.0" y="340.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">C = Q ÷ V    1 F = 1 C V⁻¹</text><text x="480.0" y="28.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Series: same Q, p.d.s add</text><path d="M380 120H430M470 120H520M560 120H600V200H380V120" stroke="#1d2733" stroke-width="2.2" fill="none"/><path d="M445 104V136M455 104V136" stroke="#1d2733" stroke-width="3.5"/><path d="M535 104V136M545 104V136" stroke="#1d2733" stroke-width="3.5"/><text x="450.0" y="92.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">2.0 μF</text><text x="540.0" y="92.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">3.0 μF</text><rect x="476" y="190" width="10" height="20" fill="var(--panel,#fff)"/><path d="M478.0 186.0L478.0 214.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M486.0 192.0L486.0 208.0" stroke="#1d2733" stroke-width="5" fill="none" stroke-linecap="round"/><text x="482.0" y="232.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">10 V</text><text x="450.0" y="160.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">6.0 V</text><text x="540.0" y="160.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">4.0 V</text><text x="370.0" y="262.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">1/C = 1/2.0 + 1/3.0 → C = 1.2 μF</text><text x="370.0" y="281.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Q = CV = 12 μC on each</text><text x="370.0" y="300.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">V₁ = 12 ÷ 2.0 = 6.0 V, V₂ = 12 ÷ 3.0 = 4.0 V</text><text x="370.0" y="319.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">C is less than the smallest</text><text x="780.0" y="28.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Parallel: same V, charges add</text><path d="M700 110V200H760M800 200H860V110" stroke="#1d2733" stroke-width="2.2" fill="none"/><circle cx="700.0" cy="160.0" r="4" fill="#1d2733"/><circle cx="860.0" cy="160.0" r="4" fill="#1d2733"/><path d="M700 110H760M800 110H860M700 160H760M800 160H860" stroke="#1d2733" stroke-width="2.2" fill="none"/><path d="M775 94V126M785 94V126" stroke="#1d2733" stroke-width="3.5"/><path d="M775 144V176M785 144V176" stroke="#1d2733" stroke-width="3.5"/><text x="870.0" y="115.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">2.0 μF</text><text x="870.0" y="165.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">3.0 μF</text><rect x="774" y="190" width="10" height="20" fill="var(--panel,#fff)"/><path d="M776.0 186.0L776.0 214.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M784.0 192.0L784.0 208.0" stroke="#1d2733" stroke-width="5" fill="none" stroke-linecap="round"/><text x="780.0" y="232.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">10 V</text><text x="680.0" y="262.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">C = 2.0 + 3.0 = 5.0 μF</text><text x="680.0" y="281.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Q₁ = 2.0 × 10 = 20 μC</text><text x="680.0" y="300.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Q₂ = 3.0 × 10 = 30 μC</text><text x="680.0" y="319.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">total Q = 50 μC</text><text x="640.0" y="400.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">The rules are the opposite way round to those for resistors.</text></svg>