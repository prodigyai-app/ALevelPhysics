<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="Binding energy per nucleon against nucleon number with iron-56 at the peak" width="920" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="380" fill="#ffffff"/><defs></defs><path d="M90 70V330H610" stroke="#1d2733" stroke-width="2.5" fill="none"/><path d="M90.0 80.0L90.0 74.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M90.0 64.0L95.0 74.0L85.0 74.0Z" fill="#1d2733"/><path d="M600.0 330.0L606.0 330.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M616.0 330.0L606.0 335.0L606.0 325.0Z" fill="#1d2733"/><text x="350.0" y="364.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Nucleon number A</text><text x="104.0" y="74.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">Binding energy per nucleon (MeV)</text><path d="M94 290Q110 120 170 100Q210 94 290 104L590 140" stroke="#3f7fd6" stroke-width="3" fill="none"/><circle cx="172" cy="98" r="6" fill="#e0a64a"/><text x="182.0" y="88.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">iron-56: most stable</text><path d="M104.0 210.0L135.1 140.9" stroke="#3fb27f" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M140.0 130.0L140.5 143.4L129.6 138.5Z" fill="#3fb27f"/><text x="116.0" y="230.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">fusion</text><path d="M570.0 170.0L431.8 146.0" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M420.0 144.0L432.8 140.1L430.8 152.0Z" fill="#ef5b4c"/><text x="510.0" y="190.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">fission</text><text x="760.0" y="110.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">mass defect Δm:</text><text x="760.0" y="130.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">nucleus has less mass than</text><text x="760.0" y="146.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">its separate nucleons</text><text x="760.0" y="186.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">binding energy = Δm c²</text><text x="760.0" y="220.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">moving towards iron releases</text><text x="760.0" y="236.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">energy</text></svg>