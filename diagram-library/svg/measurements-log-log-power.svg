e-linecap="round" opacity=".14"/><path d="M519.1 340.0L519.1 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="519.1" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">0.2</text><path d="M110 70.0V340M110 340.0H560" stroke="#1d2733" stroke-width="2" fill="none"/><text x="335.0" y="384.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">lg (L / m)</text><g transform="rotate(-90 56.0 205.0)"><text x="56.0" y="205.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">lg (T / s)</text></g><text x="335.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Pendulum: if T = kLⁿ then lg T = n lg L + lg k</text><path d="M110.0 338.7L560.0 41.7" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="151.3" cy="308.2" r="5" fill="#ef5b4c"/><circle cx="274.5" cy="234.5" r="5" fill="#ef5b4c"/><circle cx="346.5" cy="180.5" r="5" fill="#ef5b4c"/><circle cx="397.6" cy="150.5" r="5" fill="#ef5b4c"/><circle cx="437.3" cy="119.0" r="5" fill="#ef5b4c"/><circle cx="469.7" cy="104.1" r="5" fill="#ef5b4c"/><circle cx="520.8" cy="66.0" r="5" fill="#ef5b4c"/><path d="M191.8181818181818 284.73350307920396H478.18181818181813V95.73350307920398" fill="none" stroke="#e0a64a" stroke-width="2"/><text x="335.0" y="302.7" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">Δ lg L = 0.70</text><text x="486.2" y="194.2" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">Δ lg T = 0.35</text><text x="600.0" y="100.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">gradient n = 0.35 ÷ 0.70 = 0.50</text><text x="600.0" y="120.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">so T ∝ L⁰·⁵ (T ∝ √L)</text><text x="600.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="600.0" y="160.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">intercept (at lg L = 0):</text><text x="600.0" y="180.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">lg k = 0.30, k = 2.01 s m⁻⁰·⁵</text><text x="600.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">k = 2π ÷ √g → g = 9.81 m s⁻²</text><text x="600.0" y="220.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="600.0" y="240.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">A straight line on log–log axes</text><text x="600.0" y="260.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">shows a power law;</text><text x="600.0" y="280.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">its gradient is the power.</text></svg>