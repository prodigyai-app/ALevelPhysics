<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-label="Free-body diagrams for a book on a table and a box on a rough slope" width="940" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="380" fill="#ffffff"/><defs></defs><text x="230.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Book on a table</text><text x="230.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">balanced: W = N</text><text x="700.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Box on a rough slope</text><text x="700.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">resolve along and at 90° to the slope</text><rect x="120" y="250" width="220" height="12" fill="#b98a5a"/><rect x="190" y="210" width="80" height="40" rx="4" fill="#3f7fd6"/><path d="M230.0 230.0L230.0 318.0" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M230.0 330.0L224.0 318.0L236.0 318.0Z" fill="#ef5b4c"/><path d="M230.0 230.0L230.0 142.0" stroke="#3fb27f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M230.0 130.0L236.0 142.0L224.0 142.0Z" fill="#3fb27f"/><text x="244.0" y="320.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">W = mg</text><text x="244.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">N (normal contact)</text><path d="M520 320L880 320L880 160Z" fill="#b98a5a" opacity=".7"/><g transform="rotate(-24 700 240)"><rect x="660" y="200" width="80" height="44" rx="4" fill="#3f7fd6"/></g><path d="M700.0 220.0L700.0 308.0" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M700.0 320.0L694.0 308.0L706.0 308.0Z" fill="#ef5b4c"/><text x="712.0" y="316.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">W</text><path d="M700.0 220.0L664.9 141.0" stroke="#3fb27f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M660.0 130.0L670.4 138.5L659.4 143.4Z" fill="#3fb27f"/><text x="650.0" y="126.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">N</text><path d="M700.0 220.0L779.0 184.9" stroke="#e0a64a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M790.0 180.0L781.5 190.4L776.6 179.4Z" fill="#e0a64a"/><text x="796.0" y="176.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">F (friction)</text><text x="700.0" y="356.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">along slope: mg sin θ = F;  at 90°: N = mg cos θ</text><text x="230.0" y="356.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">draw forces from the centre of mass</text></svg>