<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-label="Graph of p.d. against charge for a capacitor with the triangular area of 18 millijoules shaded and the 36 millijoule rectangle supplied by the battery outlined" width="920" height="410" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="410" fill="#ffffff"/><defs></defs><path d="M100.0 301.4L540.0 301.4" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 301.4L100.0 301.4" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="305.4" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">1</text><path d="M100.0 262.9L540.0 262.9" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 262.9L100.0 262.9" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="266.9" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">2</text><path d="M100.0 224.3L540.0 224.3" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 224.3L100.0 224.3" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="228.3" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">3</text><path d="M100.0 185.7L540.0 185.7" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 185.7L100.0 185.7" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="189.7" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">4</text><path d="M100.0 147.1L540.0 147.1" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 147.1L100.0 147.1" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="151.1" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">5</text><path d="M100.0 108.6L540.0 108.6" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 108.6L100.0 108.6" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="112.6" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">6</text><path d="M100.0 70.0L540.0 70.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 70.0L100.0 70.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="74.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">7</text><path d="M162.9 70.0L162.9 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M162.9 340.0L162.9 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="162.9" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">1</text><path d="M225.7 70.0L225.7 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M225.7 340.0L225.7 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="225.7" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">2</text><path d="M288.6 70.0L288.6 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M288.6 340.0L288.6 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="288.6" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">3</text><path d="M351.4 70.0L351.4 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M351.4 340.0L351.4 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="351.4" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">4</text><path d="M414.3 70.0L414.3 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M414.3 340.0L414.3 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="414.3" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">5</text><path d="M477.1 70.0L477.1 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M477.1 340.0L477.1 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="477.1" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">6</text><path d="M540.0 70.0L540.0 340.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M540.0 340.0L540.0 345.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="540.0" y="359.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">7</text><path d="M100 70.0V340M100 340.0H540" stroke="#1d2733" stroke-width="2" fill="none"/><text x="320.0" y="384.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Charge Q / mC</text><g transform="rotate(-90 56.0 205.0)"><text x="56.0" y="205.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">p.d. V / V</text></g><text x="320.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">1000 μF capacitor charged to 6.0 V</text><rect x="100" y="108.57142857142858" width="377.1428571428571" height="231.42857142857142" fill="none" stroke="#e0a64a" stroke-width="2" stroke-dasharray="7 5"/><path d="M100 340L477.1428571428571 108.57142857142858L477.1428571428571 340Z" fill="#3f7fd6" fill-opacity=".25"/><path d="M100.0 340.0L514.9 85.4" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="370.3" y="289.9" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">area = ½QV</text><text x="370.3" y="307.9" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">= 18 mJ stored</text><text x="238.3" y="130.6" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e0a64a">QV = 36 mJ from the battery</text><text x="162.9" y="162.6" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">gradient = 1 ÷ C</text><text x="590.0" y="100.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Q = CV = 6.0 mC</text><text x="590.0" y="120.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">W = ½QV = ½CV² = Q² ÷ 2C</text><text x="590.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">  = ½ × 1000 × 10⁻⁶ × 6.0² = 18 mJ</text><text x="590.0" y="160.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="590.0" y="180.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">The battery supplies QV = 36 mJ.</text><text x="590.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Half is stored; the other half</text><text x="590.0" y="220.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">is dissipated in the resistance</text><text x="590.0" y="240.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">of the circuit while charging.</text><text x="590.0" y="260.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="590.0" y="280.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Each small charge ΔQ is added</text><text x="590.0" y="300.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">at the p.d. at that moment, so the</text><text x="590.0" y="320.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">energy is the triangle, not QV.</text></svg>