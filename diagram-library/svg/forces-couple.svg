<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Two equal and opposite forces on a tap handle forming a couple with perpendicular separation 6 centimetres, and the perpendicular distance between lines of action for forces at an angle" width="920" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="400" fill="#ffffff"/><defs></defs><text x="230.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Tap handle turned by a couple</text><rect x="80" y="188" width="300" height="24" rx="12" fill="#8a94a0" stroke="#1d2733" stroke-width="1.6"/><circle cx="230" cy="200" r="22" fill="#e0a64a" stroke="#1d2733" stroke-width="1.6"/><circle cx="230.0" cy="200.0" r="4" fill="#1d2733"/><path d="M372.0 210.0L372.0 298.0" stroke="#ef5b4c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M372.0 310.0L366.0 298.0L378.0 298.0Z" fill="#ef5b4c"/><text x="382.0" y="300.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">12 N</text><path d="M88.0 190.0L88.0 102.0" stroke="#ef5b4c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M88.0 90.0L94.0 102.0L82.0 102.0Z" fill="#ef5b4c"/><text x="78.0" y="100.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">12 N</text><path d="M230.0 254.0L362.0 254.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M372.0 254.0L362.0 259.0L362.0 249.0Z" fill="#1d2733"/><path d="M230.0 254.0L98.0 254.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M88.0 254.0L98.0 249.0L98.0 259.0Z" fill="#1d2733"/><text x="230.0" y="274.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">d = 6.0 cm (perpendicular separation)</text><path d="M270 142A70 70 0 0 1 296 182" fill="none" stroke="#3fb27f" stroke-width="3"/><path d="M292.0 170.0L294.0 176.5" stroke="#3fb27f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M297.0 186.0L289.2 177.9L298.8 175.0Z" fill="#3fb27f"/><text x="306.0" y="148.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">turns</text><text x="40.0" y="330.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">torque = F × d = 12 × 0.060 = 0.72 N m</text><text x="40.0" y="349.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">resultant force = 0, so the handle turns without moving across</text><text x="680.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Forces at an angle to the bar</text><path d="M560.0 200.0L800.0 200.0" stroke="#8a94a0" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="680.0" cy="200.0" r="4" fill="#1d2733"/><path d="M800.0 200.0L787.0 262.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M784.5 273.7L781.1 260.7L792.9 263.2Z" fill="#ef5b4c"/><path d="M560.0 200.0L573.0 138.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M575.5 126.3L578.9 139.3L567.1 136.8Z" fill="#ef5b4c"/><text x="585.5" y="132.3" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">F</text><text x="774.5" y="273.7" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">F</text><path d="M822.6 92.3L773.3 327.2" stroke="#ef5b4c" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="6 5" opacity=".6"/><path d="M586.7 72.8L537.4 307.7" stroke="#ef5b4c" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="6 5" opacity=".6"/><path d="M560.0 200.0L789.9 248.3" stroke="#3fb27f" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="668.9" y="246.1" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">d</text><text x="560.0" y="330.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">use the perpendicular distance between</text><text x="560.0" y="349.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">the two lines of action, not the bar length</text></svg>