<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-label="Moving a magnet into a coil induces a current shown on a galvanometer" width="940" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="380" fill="#ffffff"/><defs></defs><rect x="110" y="170" width="160" height="50" rx="6" fill="#ef5b4c"/><rect x="190" y="170" width="80" height="50" fill="#3f7fd6"/><text x="150.0" y="202.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">N</text><text x="230.0" y="202.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">S</text><path d="M130.0 150.0L238.0 150.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M250.0 150.0L238.0 156.0L238.0 144.0Z" fill="#1d2733"/><text x="190.0" y="140.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">push the magnet in</text><ellipse cx="330" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="352" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="374" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="396" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="418" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="440" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="462" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="484" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><ellipse cx="506" cy="195" rx="10" ry="46" fill="none" stroke="#d9822b" stroke-width="4"/><path d="M330 241V300H420M480 300H516V241" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><circle cx="450" cy="300" r="26" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><path d="M450 300L462 282" stroke="#ef5b4c" stroke-width="2.5"/><text x="450.0" y="346.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">sensitive ammeter (galvanometer)</text><text x="470.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Electromagnetic induction</text><text x="470.0" y="62.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">a changing magnetic field through a coil induces a p.d.</text><text x="620.0" y="130.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">magnet still: no current</text><text x="620.0" y="154.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">move faster, use a stronger magnet</text><text x="620.0" y="178.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">or more turns: bigger p.d.</text><text x="620.0" y="202.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">pull it out: the current reverses</text><text x="620.0" y="240.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Faraday: ε = −N ΔΦ ÷ Δt</text><text x="620.0" y="266.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Lenz: the induced current opposes</text><text x="620.0" y="282.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">the change that made it</text></svg>