y="352.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">sensitive ammeter (galvanometer)</text><text x="470.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Electromagnetic induction</text><text x="470.0" y="62.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">a changing magnetic field through a coil induces a p.d.</text><text x="620.0" y="130.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">magnet still: no current</text><text x="620.0" y="154.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">move faster, use a stronger magnet</text><text x="620.0" y="178.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">or more turns: bigger p.d.</text><text x="620.0" y="202.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">pull it out: the current reverses</text><text x="620.0" y="240.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Faraday: ε = −N ΔΦ ÷ Δt</text><text x="620.0" y="266.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Lenz: the induced current opposes</text><text x="620.0" y="282.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">the change that made it</text></svg>