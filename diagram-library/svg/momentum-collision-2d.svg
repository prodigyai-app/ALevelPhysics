<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-label="Two pucks colliding at an angle with the momentum vectors drawn as a closed triangle and resolved into components" width="940" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="420" fill="#ffffff"/><defs></defs><text x="230.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Pucks on an air table (from above)</text><text x="700.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Momentum vectors (N s)</text><path d="M60.0 200.0L222.0 200.0" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M234.0 200.0L222.0 206.0L222.0 194.0Z" fill="#3f7fd6"/><circle cx="220" cy="200" r="14" fill="#3f7fd6"/><text x="110.0" y="186.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">A: 0.20 kg, 3.0 m s⁻¹</text><circle cx="260" cy="200" r="17" fill="#ef5b4c"/><text x="246.0" y="234.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">B: 0.30 kg at rest</text><path d="M260.0 200.0L334.5 71.0" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M340.0 61.4L339.3 73.7L329.7 68.2Z" fill="#3f7fd6"/><text x="352.0" y="50.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">A: 1.5 m s⁻¹</text><path d="M260.0 200.0L397.7 279.5" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M407.2 285.0L394.9 284.3L400.4 274.7Z" fill="#ef5b4c"/><text x="410.0" y="300.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">B: 1.73 m s⁻¹</text><path d="M260.0 200.0L460.0 200.0" stroke="#1d2733" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="6 5" opacity=".5"/><path d="M314 200A54 54 0 0 0 287.0 153.2" fill="none" stroke="#3f7fd6" stroke-width="1.5"/><text x="322.0" y="174.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">60°</text><path d="M324 200A64 64 0 0 1 315.4 232.0" fill="none" stroke="#ef5b4c" stroke-width="1.5"/><text x="332.0" y="226.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">30°</text><path d="M540.0 230.0L828.0 230.0" stroke="#1d2733" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M840.0 230.0L828.0 236.0L828.0 224.0Z" fill="#1d2733"/><text x="690.0" y="254.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">p before = 0.60</text><path d="M540.0 230.0L609.0 110.5" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M615.0 100.1L614.2 113.5L603.8 107.5Z" fill="#3f7fd6"/><text x="565.5" y="159.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">p<tspan dy="0.32em" font-size="72%">A</tspan><tspan dy="-0.23em"> = 0.30</tspan></text><path d="M615.0 100.1L829.6 224.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M840.0 230.0L826.6 229.2L832.6 218.8Z" fill="#ef5b4c"/><text x="743.5" y="159.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">p<tspan dy="0.32em" font-size="72%">B</tspan><tspan dy="-0.23em"> = 0.52</tspan></text><path d="M615.0 100.1L615.0 230.0" stroke="#1d2733" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-dasharray="6 5" opacity=".6"/><text x="577.5" y="222.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">0.15</text><text x="727.5" y="222.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">0.45</text><text x="621.0" y="169.0" font-size="11" text-anchor="start" class="sf-lab" fill="#1d2733">0.26</text><text x="520.0" y="296.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">x: 0.60 = 0.15 + p<tspan dy="0.32em" font-size="72%">Bx</tspan><tspan dy="-0.23em">  →  p</tspan><tspan dy="0.32em" font-size="72%">Bx</tspan><tspan dy="-0.23em"> = 0.45 N s</tspan></text><text x="520.0" y="315.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">y: 0 = 0.26 + p<tspan dy="0.32em" font-size="72%">By</tspan><tspan dy="-0.23em">  →  p</tspan><tspan dy="0.32em" font-size="72%">By</tspan><tspan dy="-0.23em"> = −0.26 N s</tspan></text><text x="520.0" y="334.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">p<tspan dy="0.32em" font-size="72%">B</tspan><tspan dy="-0.23em"> = √(0.45² + 0.26²) = 0.52 N s</tspan></text><text x="520.0" y="353.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">v<tspan dy="0.32em" font-size="72%">B</tspan><tspan dy="-0.23em"> = 0.52 ÷ 0.30 = 1.73 m s⁻¹ at 30° below the line</tspan></text><text x="230.0" y="380.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">momentum is conserved in each of two perpendicular directions</text></svg>