<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Conservation of momentum when two trolleys collide and stick together" width="960" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><defs></defs><defs><linearGradient id="sgco25fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6b0bb"/><stop offset="1" stop-color="#6b7480"/></linearGradient></defs><text x="230.0" y="40.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Before</text><text x="700.0" y="40.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">After (they stick together)</text><rect x="50" y="200" width="380" height="10" rx="3" fill="url(#sgco25fl)"/><rect x="510" y="200" width="400" height="10" rx="3" fill="url(#sgco25fl)"/><ellipse cx="150.0" cy="202.0" rx="48.0" ry="5.0" fill="#000" opacity="0.28"/><defs><linearGradient id="sgco25a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa8f0"/><stop offset="1" stop-color="#2457a8"/></linearGradient></defs><rect x="102.0" y="150" width="96" height="34" rx="5" fill="url(#sgco25a)" stroke="#1d2733" stroke-width="1.5"/><rect x="106.0" y="153" width="88" height="6" rx="3" fill="#fff" opacity=".28"/><rect x="96.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><rect x="196.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><circle cx="118.0" cy="190" r="10" fill="#22262e"/><circle cx="118.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="118.0" cy="190" r="1.6" fill="#22262e"/><circle cx="182.0" cy="190" r="10" fill="#22262e"/><circle cx="182.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="182.0" cy="190" r="1.6" fill="#22262e"/><text x="150.0" y="173.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">2 kg</text><path d="M120.0 120.0L178.0 120.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M190.0 120.0L178.0 126.0L178.0 114.0Z" fill="#1d2733"/><text x="155.0" y="110.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">3 m/s</text><ellipse cx="320.0" cy="202.0" rx="40.0" ry="5.0" fill="#000" opacity="0.28"/><defs><linearGradient id="sgco25b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#b83a2c"/></linearGradient></defs><rect x="280.0" y="150" width="80" height="34" rx="5" fill="url(#sgco25b)" stroke="#1d2733" stroke-width="1.5"/><rect x="284.0" y="153" width="72" height="6" rx="3" fill="#fff" opacity=".28"/><rect x="274.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><rect x="358.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><circle cx="296.0" cy="190" r="10" fill="#22262e"/><circle cx="296.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="296.0" cy="190" r="1.6" fill="#22262e"/><circle cx="344.0" cy="190" r="10" fill="#22262e"/><circle cx="344.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="344.0" cy="190" r="1.6" fill="#22262e"/><text x="320.0" y="173.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1 kg</text><text x="320.0" y="125.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">at rest</text><rect x="276" y="160" width="8" height="12" fill="#c9c9c9"/><path d="M278 162h-6v8h6" fill="#7d858f"/><ellipse cx="650.0" cy="202.0" rx="48.0" ry="5.0" fill="#000" opacity="0.28"/><defs><linearGradient id="sgco25c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa8f0"/><stop offset="1" stop-color="#2457a8"/></linearGradient></defs><rect x="602.0" y="150" width="96" height="34" rx="5" fill="url(#sgco25c)" stroke="#1d2733" stroke-width="1.5"/><rect x="606.0" y="153" width="88" height="6" rx="3" fill="#fff" opacity=".28"/><rect x="596.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><rect x="696.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><circle cx="618.0" cy="190" r="10" fill="#22262e"/><circle cx="618.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="618.0" cy="190" r="1.6" fill="#22262e"/><circle cx="682.0" cy="190" r="10" fill="#22262e"/><circle cx="682.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="682.0" cy="190" r="1.6" fill="#22262e"/><text x="650.0" y="173.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">2 kg</text><ellipse cx="745.0" cy="202.0" rx="40.0" ry="5.0" fill="#000" opacity="0.28"/><defs><linearGradient id="sgco25d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#b83a2c"/></linearGradient></defs><rect x="705.0" y="150" width="80" height="34" rx="5" fill="url(#sgco25d)" stroke="#1d2733" stroke-width="1.5"/><rect x="709.0" y="153" width="72" height="6" rx="3" fill="#fff" opacity=".28"/><rect x="699.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><rect x="783.0" y="166" width="8" height="10" rx="2" fill="#7d858f"/><circle cx="721.0" cy="190" r="10" fill="#22262e"/><circle cx="721.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="721.0" cy="190" r="1.6" fill="#22262e"/><circle cx="769.0" cy="190" r="10" fill="#22262e"/><circle cx="769.0" cy="190" r="4.5" fill="#b8c0c8"/><circle cx="769.0" cy="190" r="1.6" fill="#22262e"/><text x="745.0" y="173.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1 kg</text><rect x="696" y="160" width="10" height="12" rx="2" fill="#7d858f"/><path d="M660.0 120.0L728.0 120.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M740.0 120.0L728.0 126.0L728.0 114.0Z" fill="#1d2733"/><text x="700.0" y="110.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">2 m/s</text><text x="230.0" y="250.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">momentum = 2 × 3 + 1 × 0 = 6 kg m/s</text><text x="700.0" y="250.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">momentum = 3 × 2 = 6 kg m/s</text><text x="480.0" y="300.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">p = m v.  In a closed system the total momentum before = total momentum after</text><text x="480.0" y="326.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">Explosions: total momentum before is zero, so the parts move apart with equal and opposite momentum</text><text x="480.0" y="350.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">kinetic energy is conserved only in an elastic collision</text></svg>