<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Conservation of momentum when two trolleys collide and stick together" width="960" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><defs></defs><text x="230.0" y="40.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Before</text><text x="700.0" y="40.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">After (they stick together)</text><rect x="110" y="150" width="80" height="40" rx="6" fill="#3f7fd6"/><circle cx="126" cy="196" r="8" fill="#22262e"/><circle cx="174" cy="196" r="8" fill="#22262e"/><text x="150.0" y="175.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">2 kg</text><path d="M150.0 130.0L198.0 130.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M210.0 130.0L198.0 136.0L198.0 124.0Z" fill="#1d2733"/><text x="180.0" y="120.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">3 m/s</text><rect x="280" y="150" width="80" height="40" rx="6" fill="#ef5b4c"/><circle cx="296" cy="196" r="8" fill="#22262e"/><circle cx="344" cy="196" r="8" fill="#22262e"/><text x="320.0" y="175.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1 kg</text><text x="320.0" y="125.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">at rest</text><path d="M60 206H420M520 206H900" stroke="#1d2733" stroke-width="2"/><rect x="610" y="150" width="160" height="40" rx="6" fill="#9b7ad6"/><circle cx="634" cy="196" r="8" fill="#22262e"/><circle cx="746" cy="196" r="8" fill="#22262e"/><text x="690.0" y="175.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">3 kg</text><path d="M690.0 130.0L748.0 130.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M760.0 130.0L748.0 136.0L748.0 124.0Z" fill="#1d2733"/><text x="725.0" y="120.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">2 m/s</text><text x="230.0" y="250.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">momentum = 2 × 3 + 1 × 0 = 6 kg m/s</text><text x="700.0" y="250.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">momentum = 3 × 2 = 6 kg m/s</text><text x="480.0" y="300.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">p = m v.  In a closed system the total momentum before = total momentum after</text><text x="480.0" y="326.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">Explosions: total momentum before is zero, so the parts move apart with equal and opposite momentum</text><text x="480.0" y="350.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">kinetic energy is conserved only in an elastic collision</text></svg>