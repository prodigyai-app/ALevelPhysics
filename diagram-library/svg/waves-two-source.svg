0" y="175.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="640.0" y="194.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">dashed: crest meets trough</text><text x="640.0" y="213.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">path difference = (n + ½)λ</text><text x="640.0" y="232.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">→ destructive: minimum</text><rect x="630.0" y="268.0" width="290.0" height="112.0" rx="8" fill="#e0a64a" fill-opacity="0.1" stroke="#e0a64a" stroke-width="1.6"/><text x="642.0" y="290.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Two loudspeakers, 680 Hz, v = 340 m s⁻¹</text><text x="642.0" y="309.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">λ = 340 ÷ 680 = 0.50 m</text><text x="642.0" y="328.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">path difference = 4.75 − 4.00 = 0.75 m</text><text x="642.0" y="347.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">= 1.5λ → quiet (destructive)</text><text x="642.0" y="366.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">sources must be coherent</text></svg>