<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-label="Bars showing the percentage uncertainty in h and in t, with t counted twice because it is squared, adding to the percentage uncertainty in g" width="940" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="380" fill="#ffffff"/><defs></defs><text x="470.0" y="28.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">g = 2h ÷ t²: add percentage uncertainties, doubling for the square</text><rect x="250" y="70" width="30.0" height="30" rx="4" fill="#3f7fd6" fill-opacity=".85"/><text x="238.0" y="90.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">h</text><text x="290.0" y="90.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">2 mm ÷ 800 mm = 0.25 %</text><rect x="250" y="120" width="148.5" height="30" rx="4" fill="#ef5b4c" fill-opacity=".85"/><text x="238.0" y="140.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">t</text><text x="408.5" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">5 ms ÷ 404 ms = 1.24 %</text><rect x="250" y="170" width="148.5" height="30" rx="4" fill="#ef5b4c" fill-opacity=".85"/><text x="238.0" y="190.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">t again</text><text x="408.5" y="190.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">squared: counts twice</text><rect x="250" y="236" width="30.0" height="34" fill="#3f7fd6" fill-opacity=".85"/><rect x="280.0" y="236" width="148.5" height="34" fill="#ef5b4c" fill-opacity=".85"/><rect x="428.5" y="236" width="148.5" height="34" fill="#ef5b4c" fill-opacity=".6"/><text x="238.0" y="258.0" font-size="15" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">g</text><text x="587.0" y="258.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">0.25 + 2 × 1.24 = 2.7 %</text><path d="M250.0 222.0L577.0 222.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".4"/><text x="60.0" y="310.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">g = 2 × 0.800 ÷ 0.404² = 9.80 m s⁻²   ±2.7 % = ±0.27 m s⁻²   →   g = 9.8 ± 0.3 m s⁻²</text><text x="60.0" y="332.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Rules: add or subtract → add absolute uncertainties;  multiply or divide → add percentages;  power n → multiply the percentage by n.</text></svg>