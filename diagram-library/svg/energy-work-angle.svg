<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="A sledge pulled by a rope at 35 degrees showing the horizontal and vertical components of the tension, friction and the displacement" width="920" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="400" fill="#ffffff"/><defs></defs><text x="460.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Only the component of the force along the displacement does work</text><path d="M40 250H880" stroke="#1d2733" stroke-width="2"/><path d="M40 250H880V262H40Z" fill="#dfe8f2" opacity=".5"/><path d="M220 246h170l20 -24h-200z" fill="#e0a64a" stroke="#1d2733" stroke-width="1.6"/><path d="M200 248h220" stroke="#1d2733" stroke-width="4" stroke-linecap="round"/><path d="M400.0 228.0L608.4 82.1" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M400.0 228.0L578.6 103.0" stroke="#ef5b4c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M588.4 96.1L582.0 107.9L575.1 98.0Z" fill="#ef5b4c"/><text x="574.4" y="80.1" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">T = 80 N</text><path d="M400.0 228.0L576.4 228.0" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M588.4 228.0L576.4 234.0L576.4 222.0Z" fill="#3f7fd6"/><path d="M588.4 228.0L588.4 96.1" stroke="#3f7fd6" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6 5"/><text x="534.2" y="274.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">F cos θ = 65.5 N (does work)</text><text x="598.4" y="172.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">F sin θ = 45.9 N</text><text x="598.4" y="190.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">(no work: ⊥ to motion)</text><path d="M460 228A60 60 0 0 0 449.1 193.6" fill="none" stroke="#1d2733" stroke-width="1.5"/><text x="470.0" y="214.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">θ = 35°</text><path d="M210.0 236.0L132.0 236.0" stroke="#9b6bd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M120.0 236.0L132.0 230.0L132.0 242.0Z" fill="#9b6bd6"/><text x="140.0" y="222.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#9b6bd6">friction 55 N</text><path d="M220.0 300.0L688.0 300.0" stroke="#3fb27f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M700.0 300.0L688.0 306.0L688.0 294.0Z" fill="#3fb27f"/><path d="M220.0 292.0L220.0 308.0" stroke="#3fb27f" stroke-width="2" fill="none" stroke-linecap="round"/><text x="460.0" y="322.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">displacement x = 50 m</text><text x="60.0" y="352.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">W = Fx cos θ = 80 × 50 × cos 35° = 3280 J by the tension</text><text x="60.0" y="371.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">work against friction = 55 × 50 = 2750 J   →   gain in kinetic energy ≈ 530 J</text></svg>