<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-label="Stellar parallax: the Earth on opposite sides of its orbit sees a nearby star at angle p, defining the parsec" width="940" height="430" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="430" fill="#ffffff"/><defs></defs><text x="300.0" y="24.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Parallax: observe 6 months apart</text><ellipse cx="300" cy="330" rx="120" ry="34" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="5 5" opacity=".7"/><circle cx="300" cy="330" r="14" fill="#e0a64a"/><text x="300.0" y="362.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">Sun</text><circle cx="180" cy="330" r="8" fill="#3f7fd6"/><circle cx="420" cy="330" r="8" fill="#3f7fd6"/><text x="168.0" y="334.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">Earth in January</text><text x="432.0" y="334.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">Earth in July</text><path d="M180.0 330.0L300.0 80.0" stroke="#3f7fd6" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M420.0 330.0L300.0 80.0" stroke="#3f7fd6" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M300.0 330.0L300.0 80.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M300 130A50 50 0 0 0 321.6 125.1" fill="none" stroke="#ef5b4c" stroke-width="2.5"/><text x="316.0" y="144.0" font-size="15" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">p</text><circle cx="300" cy="80" r="7" fill="#ef5b4c"/><text x="312.0" y="74.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">nearby star</text><path d="M360.0 374.0L410.0 374.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M420.0 374.0L410.0 379.0L410.0 369.0Z" fill="#1d2733"/><path d="M360.0 374.0L310.0 374.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M300.0 374.0L310.0 369.0L310.0 379.0Z" fill="#1d2733"/><text x="360.0" y="392.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">1 AU</text><text x="280.0" y="205.0" font-size="15" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">d</text><circle cx="90" cy="60" r="2.5" fill="#1d2733" opacity=".7"/><circle cx="150" cy="46" r="2.5" fill="#1d2733" opacity=".7"/><circle cx="450" cy="52" r="2.5" fill="#1d2733" opacity=".7"/><circle cx="520" cy="70" r="2.5" fill="#1d2733" opacity=".7"/><circle cx="60" cy="120" r="2.5" fill="#1d2733" opacity=".7"/><circle cx="540" cy="120" r="2.5" fill="#1d2733" opacity=".7"/><text x="300.0" y="420.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">distant stars form a fixed background; the nearby star appears to shift against them (angles exaggerated)</text><rect x="600.0" y="80.0" width="310.0" height="250.0" rx="8" fill="#3f7fd6" fill-opacity="0.08" stroke="#3f7fd6" stroke-width="1.6"/><text x="616.0" y="108.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">tan p ≈ p = 1 AU ÷ d  (p in radians)</text><text x="616.0" y="129.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="616.0" y="150.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">The parsec: the distance at which</text><text x="616.0" y="171.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">1 AU subtends 1 arcsecond.</text><text x="616.0" y="192.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">1 pc = 3.09 × 10¹⁶ m ≈ 3.26 ly</text><text x="616.0" y="213.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">d (pc) = 1 ÷ p (arcseconds)</text><text x="616.0" y="234.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="616.0" y="255.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Proxima Centauri: p = 0.768″</text><text x="616.0" y="276.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">d = 1 ÷ 0.768 = 1.30 pc ≈ 4.2 ly</text><text x="616.0" y="297.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">p is half the total angular shift</text></svg>