<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Table showing which of s, u, v, a and t each of the five suvat equations contains and the one it leaves out" width="920" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="400" fill="#ffffff"/><defs></defs><text x="460.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Each suvat equation leaves out one of the five quantities</text><text x="287.0" y="90.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">s</text><text x="361.0" y="90.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">u</text><text x="435.0" y="90.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">v</text><text x="509.0" y="90.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">a</text><text x="583.0" y="90.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">t</text><text x="660.0" y="90.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">leaves out</text><rect x="40.0" y="106.0" width="190.0" height="38.0" rx="6" fill="#3f7fd6" fill-opacity="0.1" stroke="#3f7fd6" stroke-width="1.6"/><text x="135.0" y="130.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">v = u + at</text><circle cx="287" cy="125" r="13" fill="none" stroke="#ef5b4c" stroke-width="2.2" stroke-dasharray="4 3"/><text x="287.0" y="130.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">–</text><circle cx="361" cy="125" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="361.0" y="130.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="435" cy="125" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="435.0" y="130.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="509" cy="125" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="509.0" y="130.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="583" cy="125" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="583.0" y="130.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><text x="660.0" y="130.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">s</text><rect x="40.0" y="152.0" width="190.0" height="38.0" rx="6" fill="#3f7fd6" fill-opacity="0.1" stroke="#3f7fd6" stroke-width="1.6"/><text x="135.0" y="176.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">s = ½(u + v)t</text><circle cx="287" cy="171" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="287.0" y="176.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="361" cy="171" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="361.0" y="176.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="435" cy="171" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="435.0" y="176.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="509" cy="171" r="13" fill="none" stroke="#ef5b4c" stroke-width="2.2" stroke-dasharray="4 3"/><text x="509.0" y="176.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">–</text><circle cx="583" cy="171" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="583.0" y="176.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><text x="660.0" y="176.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">a</text><rect x="40.0" y="198.0" width="190.0" height="38.0" rx="6" fill="#3f7fd6" fill-opacity="0.1" stroke="#3f7fd6" stroke-width="1.6"/><text x="135.0" y="222.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">s = ut + ½at²</text><circle cx="287" cy="217" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="287.0" y="222.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="361" cy="217" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="361.0" y="222.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="435" cy="217" r="13" fill="none" stroke="#ef5b4c" stroke-width="2.2" stroke-dasharray="4 3"/><text x="435.0" y="222.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">–</text><circle cx="509" cy="217" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="509.0" y="222.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="583" cy="217" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="583.0" y="222.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><text x="660.0" y="222.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">v</text><rect x="40.0" y="244.0" width="190.0" height="38.0" rx="6" fill="#3f7fd6" fill-opacity="0.1" stroke="#3f7fd6" stroke-width="1.6"/><text x="135.0" y="268.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">s = vt − ½at²</text><circle cx="287" cy="263" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="287.0" y="268.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="361" cy="263" r="13" fill="none" stroke="#ef5b4c" stroke-width="2.2" stroke-dasharray="4 3"/><text x="361.0" y="268.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">–</text><circle cx="435" cy="263" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="435.0" y="268.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="509" cy="263" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="509.0" y="268.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="583" cy="263" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="583.0" y="268.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><text x="660.0" y="268.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">u</text><rect x="40.0" y="290.0" width="190.0" height="38.0" rx="6" fill="#3f7fd6" fill-opacity="0.1" stroke="#3f7fd6" stroke-width="1.6"/><text x="135.0" y="314.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">v² = u² + 2as</text><circle cx="287" cy="309" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="287.0" y="314.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="361" cy="309" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="361.0" y="314.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="435" cy="309" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="435.0" y="314.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="509" cy="309" r="13" fill="#3fb27f" fill-opacity=".85"/><text x="509.0" y="314.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">✓</text><circle cx="583" cy="309" r="13" fill="none" stroke="#ef5b4c" stroke-width="2.2" stroke-dasharray="4 3"/><text x="583.0" y="314.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">–</text><text x="660.0" y="314.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">t</text><text x="730.0" y="120.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Method</text><text x="730.0" y="140.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">1  List s, u, v, a, t.</text><text x="730.0" y="160.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">2  Fill in the three you know</text><text x="730.0" y="180.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">    and the one you want.</text><text x="730.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">3  The fifth is not needed:</text><text x="730.0" y="220.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">    use the equation that</text><text x="730.0" y="240.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">    leaves it out.</text><text x="730.0" y="260.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="730.0" y="280.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Uniform acceleration only.</text><text x="730.0" y="300.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Choose a positive direction.</text></svg>