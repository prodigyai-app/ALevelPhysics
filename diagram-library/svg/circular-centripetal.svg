<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-label="An object moving in a circle with velocity along the tangent and the resultant force towards the centre at two positions, and the velocity change pointing to the centre" width="920" height="410" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="410" fill="#ffffff"/><defs></defs><text x="230.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Constant speed, changing velocity</text><circle cx="230" cy="215" r="140" fill="none" stroke="#1d2733" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/><circle cx="230.0" cy="215.0" r="4" fill="#1d2733"/><circle cx="351.2" cy="145.0" r="11" fill="#e0a64a"/><text x="365.1" y="133.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">A</text><path d="M351.2 145.0L307.2 68.8" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M301.2 58.4L312.4 65.8L302.0 71.8Z" fill="#3f7fd6"/><text x="295.2" y="52.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">v</text><path d="M351.2 145.0L295.0 177.5" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M284.6 183.5L292.0 172.3L298.0 182.7Z" fill="#ef5b4c"/><text x="284.6" y="205.5" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">F, a</text><circle cx="140.0" cy="107.8" r="11" fill="#e0a64a"/><text x="129.7" y="91.5" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">B</text><path d="M140.0 107.8L72.6 164.3" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M63.4 172.0L68.7 159.7L76.5 168.9Z" fill="#3f7fd6"/><text x="54.2" y="183.7" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">v</text><path d="M140.0 107.8L181.8 157.5" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M189.5 166.7L177.2 161.4L186.4 153.7Z" fill="#ef5b4c"/><text x="189.5" y="188.7" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">F, a</text><path d="M230.0 215.0L300.0 336.2" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="270.0" y="285.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">r</text><text x="600.0" y="74.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Change of velocity from A to B</text><path d="M520.0 230.0L471.0 145.1" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M465.0 134.7L476.2 142.1L465.8 148.1Z" fill="#3f7fd6"/><text x="461.0" y="154.7" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">v<tspan dy="0.32em" font-size="72%">A</tspan></text><path d="M520.0 230.0L444.9 293.0" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M435.7 300.7L441.1 288.4L448.8 297.6Z" fill="#3f7fd6"/><text x="441.7" y="294.7" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">v<tspan dy="0.32em" font-size="72%">B</tspan></text><path d="M465.0 134.7L437.8 288.9" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M435.7 300.7L431.9 287.8L443.7 289.9Z" fill="#ef5b4c"/><text x="456.4" y="235.7" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">Δv</text><text x="470.0" y="300.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Δv points towards the centre of the circle,</text><text x="470.0" y="320.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">so the acceleration does too.</text><text x="470.0" y="340.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">a = v² ÷ r = ω²r      F = mv² ÷ r = mω²r</text><text x="470.0" y="360.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">The resultant force does no work: it is</text><text x="470.0" y="380.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">perpendicular to the velocity, so the speed stays the same.</text></svg>