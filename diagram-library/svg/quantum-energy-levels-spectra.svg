<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Hydrogen energy levels with transitions, and emission and absorption line spectra" width="960" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="420" fill="#ffffff"/><defs></defs><text x="220.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Energy levels</text><text x="220.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">electrons jump down and emit a photon</text><text x="690.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Spectra</text><text x="690.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">each element has its own pattern of lines</text><path d="M90 360H330" stroke="#1d2733" stroke-width="2"/><text x="80.0" y="364.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">n = 1</text><text x="340.0" y="364.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">-13.6 eV</text><path d="M90 220H330" stroke="#1d2733" stroke-width="2"/><text x="80.0" y="224.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">n = 2</text><text x="340.0" y="224.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">-3.4 eV</text><path d="M90 170H330" stroke="#1d2733" stroke-width="2"/><text x="80.0" y="174.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">n = 3</text><text x="340.0" y="174.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">-1.5 eV</text><path d="M90 145H330" stroke="#1d2733" stroke-width="2"/><text x="80.0" y="149.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">n = 4</text><text x="340.0" y="149.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">-0.85 eV</text><path d="M90 100H330" stroke="#1d2733" stroke-width="2"/><text x="80.0" y="104.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">∞</text><text x="340.0" y="104.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">0 eV</text><path d="M150.0 170.0L150.0 204.0" stroke="#ef5b4c" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M150.0 216.0L144.0 204.0L156.0 204.0Z" fill="#ef5b4c"/><path d="M200.0 145.0L200.0 204.0" stroke="#3fb27f" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M200.0 216.0L194.0 204.0L206.0 204.0Z" fill="#3fb27f"/><path d="M260.0 220.0L260.0 344.0" stroke="#b07cff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M260.0 356.0L254.0 344.0L266.0 344.0Z" fill="#b07cff"/><text x="250.0" y="300.0" font-size="11" text-anchor="end" class="sf-lab" fill="#1d2733">UV</text><text x="220.0" y="400.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">photon energy hf = E₁ − E₂</text><defs><linearGradient id="lsg"><stop offset="0" stop-color="#ff2a2a"/><stop offset=".25" stop-color="#ffd02a"/><stop offset=".45" stop-color="#3ad04a"/><stop offset=".7" stop-color="#2a8aff"/><stop offset="1" stop-color="#8a2aff"/></linearGradient></defs><rect x="490" y="110" width="400" height="44" fill="#05070c"/><rect x="545.0" y="110" width="4" height="44" fill="#ef3030"/><rect x="757.5" y="110" width="4" height="44" fill="#30c8c8"/><rect x="822.5" y="110" width="4" height="44" fill="#4a50ff"/><rect x="852.5" y="110" width="4" height="44" fill="#8a3aff"/><text x="690.0" y="174.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">emission: bright lines on a dark background</text><rect x="490" y="220" width="400" height="44" fill="url(#lsg)"/><rect x="545.0" y="220" width="4" height="44" fill="#05070c"/><rect x="757.5" y="220" width="4" height="44" fill="#05070c"/><rect x="822.5" y="220" width="4" height="44" fill="#05070c"/><rect x="852.5" y="220" width="4" height="44" fill="#05070c"/><text x="690.0" y="284.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">absorption: dark lines in a continuous spectrum</text><text x="690.0" y="340.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">hydrogen lines at the same wavelengths in both</text><text x="690.0" y="358.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">λ = h c ÷ ΔE</text></svg>