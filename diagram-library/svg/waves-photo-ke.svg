<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="Graph of maximum kinetic energy against frequency for copper and sodium: parallel lines of gradient h with intercepts at the threshold frequency and minus the work function" width="920" height="430" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="430" fill="#ffffff"/><defs></defs><path d="M100.0 400.0L600.0 400.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 400.0L100.0 400.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="404.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">−5</text><path d="M100.0 358.8L600.0 358.8" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 358.8L100.0 358.8" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="362.8" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">−4</text><path d="M100.0 317.5L600.0 317.5" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 317.5L100.0 317.5" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="321.5" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">−3</text><path d="M100.0 276.3L600.0 276.3" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 276.3L100.0 276.3" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="280.3" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">−2</text><path d="M100.0 235.0L600.0 235.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 235.0L100.0 235.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="239.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">−1</text><path d="M100.0 152.5L600.0 152.5" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 152.5L100.0 152.5" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="156.5" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">1</text><path d="M100.0 111.3L600.0 111.3" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 111.3L100.0 111.3" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="115.3" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">2</text><path d="M100.0 70.0L600.0 70.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M95.0 70.0L100.0 70.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="91.0" y="74.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">3</text><path d="M225.0 70.0L225.0 400.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M225.0 193.8L225.0 198.8" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="225.0" y="212.8" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">0.5</text><path d="M350.0 70.0L350.0 400.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M350.0 193.8L350.0 198.8" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="350.0" y="212.8" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">1</text><path d="M475.0 70.0L475.0 400.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M475.0 193.8L475.0 198.8" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="475.0" y="212.8" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">1.5</text><path d="M600.0 70.0L600.0 400.0" stroke="#1d2733" stroke-width="1" fill="none" stroke-linecap="round" opacity=".14"/><path d="M600.0 193.8L600.0 198.8" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="600.0" y="212.8" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">2</text><path d="M100 70.0V400M100 193.8H600" stroke="#1d2733" stroke-width="2" fill="none"/><text x="350.0" y="444.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733"></text><g transform="rotate(-90 46.0 235.0)"><text x="46.0" y="235.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">KE<tspan dy="0.32em" font-size="72%">max</tspan><tspan dy="-0.23em"> / eV</tspan></text></g><text x="350.0" y="193.8" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733"></text><text x="587.5" y="183.8" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733">f / 10¹⁵ Hz</text><text x="350.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">hf = φ + KE<tspan dy="0.32em" font-size="72%">max</tspan><tspan dy="-0.23em">  →  KE</tspan><tspan dy="0.32em" font-size="72%">max</tspan><tspan dy="-0.23em"> = hf − φ</tspan></text><path d="M100.0 387.6L383.6 193.8" stroke="#3f7fd6" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M383.6 193.8L564.6 70.0" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="383.6" cy="193.8" r="5" fill="#3f7fd6"/><circle cx="100.0" cy="387.6" r="5" fill="#3f7fd6"/><text x="110.0" y="392.6" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">−φ = −4.7 eV (copper)</text><text x="389.6" y="227.8" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">f₀ = 1.13</text><text x="570.6" y="84.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3f7fd6">copper</text><path d="M100.0 287.8L237.6 193.8" stroke="#3fb27f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M237.6 193.8L418.6 70.0" stroke="#3fb27f" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="237.6" cy="193.8" r="5" fill="#3fb27f"/><circle cx="100.0" cy="287.8" r="5" fill="#3fb27f"/><text x="110.0" y="292.8" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">−φ = −2.28 eV (sodium)</text><text x="243.6" y="227.8" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#3fb27f">f₀ = 0.55</text><text x="424.6" y="84.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">sodium</text><circle cx="475.0" cy="131.2" r="6" fill="#e0a64a"/><text x="485.0" y="149.2" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">200 nm UV: 1.52 eV</text><text x="640.0" y="90.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Every metal gives a line of</text><text x="640.0" y="110.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">gradient h (the Planck constant).</text><text x="640.0" y="130.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="640.0" y="150.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">x-intercept: threshold frequency f₀</text><text x="640.0" y="170.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">y-intercept: −φ (work function)</text><text x="640.0" y="190.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="640.0" y="210.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Below f₀ no electrons escape,</text><text x="640.0" y="230.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">however bright the light.</text><text x="640.0" y="250.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">Brighter light: more electrons</text><text x="640.0" y="270.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">per second, same KE<tspan dy="0.32em" font-size="72%">max</tspan><tspan dy="-0.23em">.</tspan></text><text x="640.0" y="290.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733"></text><text x="640.0" y="310.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">gradient = 4.14 eV per 10¹⁵ Hz</text><text x="640.0" y="330.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">= 6.63 × 10⁻³⁴ J s</text></svg>