<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Circuit for finding e.m.f. and internal resistance, and the V against I graph" width="960" height="430" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="430" fill="#ffffff"/><defs></defs><rect x="160" y="70" width="160" height="80" rx="6" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M100 110H190" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="172" y="94" width="26" height="32" fill="#ffffff"/><path d="M179 92V128M191 100V120" stroke="#1d2733" stroke-width="3.5"/><path d="M198 110H245" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="248" y="101" width="44" height="18" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><path d="M292 110H420V300H100V110" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><text x="185.0" y="88.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">ε</text><text x="270.0" y="88.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">r</text><text x="240.0" y="168.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">the cell</text><circle cx="420" cy="205" r="15" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><text x="420.0" y="211.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">A</text><rect x="220" y="282" width="60" height="36" fill="#ffffff"/><rect x="228" y="291" width="44" height="18" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><path d="M215.0 322.0L280.3 282.6" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M288.0 278.0L282.6 286.5L278.0 278.8Z" fill="#1d2733"/><text x="250.0" y="345.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">variable resistor R</text><path d="M100 110V40H360V110" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linejoin="round"/><rect x="215" y="25" width="30" height="30" fill="#ffffff"/><circle cx="230" cy="40" r="15" fill="#ffffff" stroke="#1d2733" stroke-width="2.5"/><text x="230.0" y="46.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">V</text><text x="260.0" y="386.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">Change R, record V and I;</text><text x="260.0" y="404.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">disconnect between readings so the cell does not warm up</text><path d="M560 90V340H890" stroke="#1d2733" stroke-width="2.5" fill="none"/><path d="M560.0 100.0L560.0 94.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M560.0 84.0L565.0 94.0L555.0 94.0Z" fill="#1d2733"/><path d="M880.0 340.0L886.0 340.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M896.0 340.0L886.0 345.0L886.0 335.0Z" fill="#1d2733"/><text x="725.0" y="374.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Current I (A)</text><text x="574.0" y="94.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">Terminal p.d. V (V)</text><path d="M560 140L860 290" stroke="#3f7fd6" stroke-width="3"/><circle cx="600" cy="160" r="4.5" fill="#3f7fd6"/><circle cx="655" cy="187.5" r="4.5" fill="#3f7fd6"/><circle cx="710" cy="215" r="4.5" fill="#3f7fd6"/><circle cx="765" cy="242.5" r="4.5" fill="#3f7fd6"/><circle cx="820" cy="270" r="4.5" fill="#3f7fd6"/><text x="552.0" y="144.0" font-size="15" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">ε</text><text x="760.0" y="180.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">gradient = −r</text><text x="725.0" y="410.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">V = ε − I r</text></svg>