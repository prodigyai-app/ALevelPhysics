<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Graph of gravitational potential against distance, rising towards zero at infinity" width="920" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="400" fill="#ffffff"/><defs></defs><path d="M110 60V340M110 80H590" stroke="#1d2733" stroke-width="2.5"/><path d="M580.0 80.0L590.0 80.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M600.0 80.0L590.0 85.0L590.0 75.0Z" fill="#1d2733"/><text x="580.0" y="68.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733">distance r</text><text x="102.0" y="70.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">0</text><text x="96.0" y="200.0" font-size="14" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">V_g</text><path d="M150.0 330.0L155.5 299.8L161.0 276.1L166.5 257.0L172.0 241.3L177.5 228.1L183.0 217.0L188.5 207.4L194.0 199.0L199.5 191.7L205.0 185.3L210.5 179.5L216.0 174.3L221.5 169.7L227.0 165.5L232.5 161.6L238.0 158.1L243.5 154.9L249.0 151.9L254.5 149.2L260.0 146.7L265.5 144.3L271.0 142.1L276.5 140.1L282.0 138.1L287.5 136.3L293.0 134.6L298.5 133.1L304.0 131.5L309.5 130.1L315.0 128.8L320.5 127.5L326.0 126.3L331.5 125.1L337.0 124.1L342.5 123.0L348.0 122.0L353.5 121.1L359.0 120.2L364.5 119.3L370.0 118.5L375.5 117.7L381.0 116.9L386.5 116.2L392.0 115.5L397.5 114.8L403.0 114.1L408.5 113.5L414.0 112.9L419.5 112.3L425.0 111.7L430.5 111.2L436.0 110.7L441.5 110.2L447.0 109.7L452.5 109.2L458.0 108.7L463.5 108.3L469.0 107.9L474.5 107.4L480.0 107.0L485.5 106.6L491.0 106.2L496.5 105.9L502.0 105.5L507.5 105.2L513.0 104.8L518.5 104.5L524.0 104.2L529.5 103.8L535.0 103.5L540.5 103.2L546.0 102.9L551.5 102.7L557.0 102.4L562.5 102.1L568.0 101.8L573.5 101.6L579.0 101.3L584.5 101.1L590.0 100.8" stroke="#3f7fd6" stroke-width="3" fill="none"/><path d="M150 80V340" stroke="#e0a64a" stroke-dasharray="4 4"/><circle cx="110" cy="330" r="0" fill="none"/><text x="156.0" y="348.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">surface of the planet (r = R)</text><text x="720.0" y="110.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">V_g = −G M ÷ r</text><text x="720.0" y="136.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">zero at infinity, negative nearer</text><text x="720.0" y="154.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">the mass</text><text x="720.0" y="200.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">g = −(gradient of V against r)</text><text x="720.0" y="240.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">escape velocity:</text><text x="720.0" y="260.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">½ m v² = G M m ÷ r → v = √(2GM ÷ r)</text><text x="460.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Gravitational potential</text><text x="460.0" y="388.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">electric potential around a positive charge has the same shape but is positive: V = Q ÷ 4πε₀r</text></svg>