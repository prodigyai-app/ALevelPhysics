<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Heating curve showing melting and boiling at constant temperature" width="900" height="440" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="440" fill="#ffffff"/><defs></defs><path d="M150 60V360H850" stroke="#1d2733" stroke-width="2.5" fill="none"/><path d="M150.0 70.0L150.0 64.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M150.0 54.0L155.0 64.0L145.0 64.0Z" fill="#1d2733"/><path d="M840.0 360.0L846.0 360.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M856.0 360.0L846.0 365.0L846.0 355.0Z" fill="#1d2733"/><text x="500.0" y="394.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Time (energy supplied at a steady rate)</text><text x="164.0" y="64.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">Temperature</text><path d="M150 320L270 240L410 240L510 140L710 140L810 60" stroke="#e0663a" stroke-width="4" fill="none"/><path d="M150 240H270M150 140H510" stroke="#1d2733" stroke-dasharray="5 5" opacity=".6"/><text x="140.0" y="244.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">melting point</text><text x="140.0" y="144.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">boiling point</text><text x="200.0" y="300.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">solid</text><text x="340.0" y="228.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">melting</text><text x="340.0" y="264.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">solid + liquid</text><text x="440.0" y="210.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">liquid</text><text x="610.0" y="128.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">boiling</text><text x="610.0" y="164.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">liquid + gas</text><text x="770.0" y="70.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">gas</text><text x="450.0" y="40.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Flat sections: energy breaks bonds between particles (latent heat), so temperature stays constant</text></svg>