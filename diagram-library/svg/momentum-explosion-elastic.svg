<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-label="Two trolleys pushed apart by a spring with equal and opposite momentum, and an elastic collision in which momentum and kinetic energy are both conserved" width="940" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="420" fill="#ffffff"/><defs></defs><text x="230.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Explosion: trolleys pushed apart</text><text x="700.0" y="30.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Elastic collision</text><text x="40.0" y="72.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">before</text><path d="M30 126H440" stroke="#1d2733" stroke-width="1.5"/><rect x="150.0" y="78.0" width="70" height="34" rx="5" fill="#3f7fd6" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="165.4" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="204.6" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="185.0" y="100.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1.0 kg</text><rect x="222.0" y="78.0" width="110" height="34" rx="5" fill="#ef5b4c" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="246.2" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="307.8" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="277.0" y="100.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">2.0 kg</text><text x="240.0" y="152.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">at rest: total momentum = 0</text><text x="40.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">after</text><path d="M30 254H440" stroke="#1d2733" stroke-width="1.5"/><rect x="90.0" y="206.0" width="70" height="34" rx="5" fill="#3f7fd6" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="105.4" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="144.6" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="125.0" y="228.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1.0 kg</text><rect x="282.0" y="206.0" width="110" height="34" rx="5" fill="#ef5b4c" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="306.2" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="367.8" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="337.0" y="228.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">2.0 kg</text><path d="M150.0 194.0L121.2 194.0" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M109.2 194.0L121.2 188.0L121.2 200.0Z" fill="#3f7fd6"/><text x="130.0" y="182.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">0.60 m s⁻¹</text><path d="M330.0 194.0L338.4 194.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M350.4 194.0L338.4 200.0L338.4 188.0Z" fill="#ef5b4c"/><text x="350.0" y="182.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">0.30 m s⁻¹</text><text x="40.0" y="296.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">1.0 × (−0.60) + 2.0 × (+0.30) = 0</text><text x="40.0" y="315.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">momentum is still zero: the trolleys</text><text x="40.0" y="334.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">move apart with equal and opposite</text><text x="40.0" y="353.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">momentum (0.60 N s each)</text><text x="40.0" y="372.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">kinetic energy comes from the spring</text><line x1="470" y1="50" x2="470" y2="400" stroke="#1d2733" stroke-opacity=".2"/><text x="510.0" y="72.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">before</text><path d="M500 126H910" stroke="#1d2733" stroke-width="1.5"/><rect x="530.0" y="78.0" width="110" height="34" rx="5" fill="#ef5b4c" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="554.2" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="615.8" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="585.0" y="100.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">2.0 kg</text><rect x="780.0" y="78.0" width="70" height="34" rx="5" fill="#3f7fd6" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="795.4" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="834.6" cy="119.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="815.0" y="100.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1.0 kg</text><path d="M640.0 86.0L730.0 86.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M742.0 86.0L730.0 92.0L730.0 80.0Z" fill="#ef5b4c"/><text x="690.0" y="76.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">3.0 m s⁻¹</text><text x="815.0" y="160.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">at rest</text><text x="510.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">after</text><path d="M500 254H910" stroke="#1d2733" stroke-width="1.5"/><rect x="600.0" y="206.0" width="110" height="34" rx="5" fill="#ef5b4c" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="624.2" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="685.8" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="655.0" y="228.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">2.0 kg</text><rect x="760.0" y="206.0" width="70" height="34" rx="5" fill="#3f7fd6" fill-opacity=".85" stroke="#1d2733" stroke-width="1.5"/><circle cx="775.4" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><circle cx="814.6" cy="247.0" r="7" fill="#8a94a0" stroke="#1d2733" stroke-width="1.5"/><text x="795.0" y="228.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">1.0 kg</text><path d="M710.0 214.0L732.0 214.0" stroke="#ef5b4c" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M744.0 214.0L732.0 220.0L732.0 208.0Z" fill="#ef5b4c"/><text x="728.0" y="204.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">1.0</text><path d="M830.0 214.0L886.0 214.0" stroke="#3f7fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M898.0 214.0L886.0 220.0L886.0 208.0Z" fill="#3f7fd6"/><text x="866.0" y="204.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">4.0 m s⁻¹</text><text x="510.0" y="296.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">momentum: 2.0 × 3.0 = 2.0 × 1.0 + 1.0 × 4.0 = 6.0 N s</text><text x="510.0" y="315.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">kinetic energy: ½ × 2.0 × 3.0² = 9.0 J</text><text x="510.0" y="334.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">   after: ½ × 2.0 × 1.0² + ½ × 1.0 × 4.0² = 1.0 + 8.0 = 9.0 J</text><text x="510.0" y="353.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">elastic: kinetic energy is conserved as well</text><text x="510.0" y="372.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">relative speed of approach = relative speed of separation (3.0)</text></svg>