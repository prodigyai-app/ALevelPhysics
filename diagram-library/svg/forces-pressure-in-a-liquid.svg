<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="Water spurting from holes at different depths in a container" width="860" height="440" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="860" height="440" fill="#ffffff"/><defs></defs><rect x="200" y="60" width="160" height="320" rx="6" fill="#9fd4e6" fill-opacity=".45" stroke="#cfe0ea" stroke-width="4"/><path d="M200 80H360" stroke="#5aa9f0" stroke-width="2"/><circle cx="360" cy="170" r="5" fill="#cfe0ea"/><path d="M364 170Q414 160 444 380" stroke="#5aa9f0" stroke-width="4" fill="none"/><circle cx="360" cy="250" r="5" fill="#cfe0ea"/><path d="M364 250Q474 240 540 380" stroke="#5aa9f0" stroke-width="5" fill="none"/><circle cx="360" cy="330" r="5" fill="#cfe0ea"/><path d="M364 330Q534 320 636 380" stroke="#5aa9f0" stroke-width="6" fill="none"/><path d="M180 80V380" stroke="#1d2733" stroke-width="2"/><path d="M180.0 100.0L180.0 358.0" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M180.0 370.0L174.0 358.0L186.0 358.0Z" fill="#1d2733"/><text x="170.0" y="230.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733">depth</text><text x="560.0" y="150.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">Water spurts further from lower holes:</text><text x="560.0" y="172.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">pressure increases with depth</text><text x="560.0" y="214.0" font-size="18" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">p = h ρ g</text><text x="560.0" y="238.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">h = depth (m), ρ = density (kg/m³)</text><text x="560.0" y="256.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">g = 9.8 N/kg</text><text x="430.0" y="420.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">Pressure acts in all directions, at right angles to any surface</text></svg>