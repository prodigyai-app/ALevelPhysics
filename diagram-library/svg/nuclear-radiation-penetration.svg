<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Alpha is stopped by paper, beta by a few millimetres of aluminium, gamma is reduced by thick lead" width="900" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><defs></defs><defs><linearGradient id="sgp3" x1="0" x2="1"><stop offset="0" stop-color="#6c7682"/><stop offset="1" stop-color="#9aa4b0"/></linearGradient></defs><rect x="50" y="100" width="90" height="240" rx="10" fill="#4a5363"/><circle cx="120" cy="220" r="16" fill="#f2c94c"/><circle cx="120" cy="220" r="5" fill="#4a5363"/><text x="95.0" y="370.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Radioactive source</text><rect x="330" y="80" width="6" height="290" fill="#f4f1e6" stroke="#cfc8b0"/><text x="333.0" y="70.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Paper</text><rect x="520" y="80" width="18" height="290" fill="#c7ced6" stroke="#9aa4b0"/><text x="529.0" y="70.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Aluminium (a few mm)</text><rect x="700" y="80" width="56" height="290" fill="url(#sgp3)" stroke="#555"/><text x="728.0" y="70.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Lead (several cm)</text><path d="M140 130H328" stroke="#ef5b4c" stroke-width="5" /><text x="160.0" y="118.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">α alpha</text><path d="M326 120l8 10 -8 10" stroke="#ef5b4c" stroke-width="3" fill="none"/><path d="M140 220H518" stroke="#3fb27f" stroke-width="5" /><text x="160.0" y="208.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3fb27f">β beta</text><path d="M140 310H700" stroke="#9b7bf2" stroke-width="5" /><text x="160.0" y="298.0" font-size="16" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#9b7bf2">γ gamma</text><path d="M756 310H860" stroke="#9b7bf2" stroke-width="2" stroke-dasharray="8 8"/><text x="808.0" y="298.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#9b7bf2">reduced</text><text x="450.0" y="405.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Alpha is the most ionising and the least penetrating; gamma is the most penetrating</text></svg>