<style>
/* Layout: practical switcher, then each lab = live apparatus stage beside a control panel, with results and worked solutions underneath */
:root{

  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-stretch:82%;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,2.8vw,1.95rem);font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{flex:none}
.brand p{color:var(--muted);font-size:.95rem}
.switcher{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.prac{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .15s}
.prac:hover{border-color:var(--muted)}
.prac:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prac[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prac .ico{grid-row:span 2;width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.prac .lvl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prac .nm{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.08rem;line-height:1.15}

/* lab layout */
.lab{display:flex;flex-direction:column;gap:18px}

.stage{border-radius:var(--r);overflow:hidden;background:#1d2224;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.35);position:relative;min-width:0}
.stage svg,.stage canvas{display:block;width:100%;height:auto}
.stage-bar{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;background:#15191b;color:#c9d2d5;font-family:var(--f-mono);font-size:.74rem}
.stage-bar b{color:#fff;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lbl i,.lbl output i{text-transform:none;font-family:Georgia,serif;font-size:1.1em}

.seg{display:grid;gap:6px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}

.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;pointer-events:none}
.opt span{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.2;min-height:38px;background:var(--panel)}
.opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);font-weight:600}

.slider{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center}

.readout div{background:var(--sunk);padding:7px 10px;display:flex;flex-direction:column}
.readout span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.readout b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:600}

@media (max-width:520px){.readout.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* lower area */
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.lower{grid-template-columns:minmax(0,1fr)}}

/* Lab results tables: larger, clearer type for projecting (November 2026) */
.lower table{font-size:1.02rem}
.lower th{font-family:var(--f-body);font-size:.92rem;font-weight:700;letter-spacing:0;color:var(--ink);background:var(--sunk);border-bottom:2px solid var(--line);padding:9px 12px;vertical-align:bottom;line-height:1.25}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.02em;color:var(--muted);font-weight:600;text-align:right}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-mono);font-size:.86rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

.graph{width:100%;height:auto;display:block;border-radius:8px;background:var(--sunk)}
details{border-top:1px solid var(--line);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}

.prose{max-width:68ch;display:flex;flex-direction:column;gap:8px;padding-top:8px;font-size:.96rem}
.prose ol,.prose ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.vars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.vars dt{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}

/* worked solution */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.chip{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.chip span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chip b{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}

.work{display:flex;flex-direction:column;gap:12px}

.wstep .n{grid-row:span 3;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}

.eqs{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding:2px 0}
.eq{font-family:var(--f-mono);font-size:.9rem;display:flex;align-items:center;flex-wrap:nowrap;gap:.35em;white-space:nowrap}
.eq .tx{white-space:normal;min-width:0;flex:1 1 auto;line-height:1.5}
.eq i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.eq .res{background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px;padding:0 6px;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25}
.fr > span{padding:0 3px}
.fr > span:first-child{border-bottom:1.5px solid currentColor}
.sq{display:inline-flex;align-items:flex-start}

.veiled > .veil-msg{display:grid}
.veil-msg span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:34ch}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}

.preset:hover{border-color:var(--accent)}

.pred{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}

.readout.c4{grid-template-columns:repeat(4,minmax(0,1fr))}

<style>

const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function sci(x,sf=3){ if(!isFinite(x)||x===0) return fmt(x,sf); const e=Math.floor(Math.log10(Math.abs(x))+1e-12); if(e>=-2&&e<5) return fmt(x,sf); const m=x/Math.pow(10,e); return `${m.toFixed(sf-1)} × 10${String(e).split("").map(ch=>SUP[ch]).join("")}`; }
const RUNCOL=["#c4531a","#1b6788","#2c7a4c","#8a4fb3","#b8892a","#b1352a"];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
let uid=0; const nid=p=>`${p}${++uid}`;

/* ---------------- maths ---------------- */
function linfit(pts){ const n=pts.length; if(n<2) return null; let sx=0,sy=0,sxx=0,sxy=0; pts.forEach(([x,y])=>{sx+=x;sy+=y;sxx+=x*x;sxy+=x*y}); const d=n*sxx-sx*sx; if(Math.abs(d)<1e-12) return null; const m=(n*sxy-sx*sy)/d; return {m,c:(sy-m*sx)/n}; }
function triX(xs){ const a=Math.min(...xs), b=Math.max(...xs), i=(b-a)*.1, st=nice(b-a,10); let xa=Math.ceil((a+i)/st)*st, xb=Math.floor((b-i)/st)*st; if(xb<=xa){xa=a;xb=b;} return [xa,xb]; }
/* Steepest/shallowest line that intersects every supplied error bar. */
function worst(pts,ey,best){ return RevisionMath.worst(pts,ey,best); }
const FIT_WARNING='<p class="note" role="status"><b>No acceptable straight line.</b> No single straight line passes through every error bar in these readings. Check for anomalous readings, repeat measurements and review the uncertainty estimates. A worst-fit uncertainty cannot be calculated from this data set.</p>';
function fitProblem(a){
  if(!a) return "";
  if(!a.w) return FIT_WARNING;
  if(a.w.pc==null) return `<p class="note" role="status">The best-fit gradient is zero, so its percentage uncertainty is undefined. The absolute gradient uncertainty is ${sci(a.w.dm,3)} in the graph’s gradient units. A derived result requiring a non-zero gradient cannot be evaluated.</p>`;
  return "";
}
function nice(span,n=6){ if(!(span>0)) return 1; const raw=span/n, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p; }

/* thermometer: returns svg; setThermo(id,T) moves the column. visible scale from yTop+14 to yTop+scaleLen */
const thermoMap={};
C.thermo=(x,yTop,len,id,{tMin=-10,tMax=110,scaleLen=null}={})=>{
  const s0=yTop+14, s1=yTop+(scaleLen||len-40), k=(s1-s0)/(tMax-tMin), bot=yTop+len-12;
  thermoMap[id]={y:T=>s1-(T-tMin)*k,bot};
  let ticks=""; for(let T=tMin;T<=tMax;T++){ const y=(s1-(T-tMin)*k).toFixed(2), L=T%10===0?5.5:T%5===0?3.8:2.2;
    if(k<1.2&&T%5&&T%10) continue;
    ticks+=`<line x1="${x-2}" x2="${x-2+L}" y1="${y}" y2="${y}" stroke="#1d1d1d" stroke-width="${T%10===0?.55:.35}"/>`;
    if(T%20===0) ticks+=`<text x="${x+7}" y="${(+y+1.6).toFixed(2)}" font-size="4.4" text-anchor="end" font-family="Arial" fill="#1d1d1d">${T}</text>`; }
  return `<g><rect x="${x-8}" y="${yTop}" width="16" height="${len}" rx="8" fill="url(#g-thGlass)" stroke="#9fb6be" stroke-width=".6"/>
<rect x="${x-2}" y="${s0-4}" width="9" height="${s1-s0+8}" rx="1" fill="#f7f5ec" opacity=".95"/>${ticks}
<rect x="${x-4.6}" y="${yTop+6}" width="2.2" height="${len-12}" fill="#fff" opacity=".65"/>
<rect id="${id}" x="${x-4.4}" y="${s1}" width="1.8" height="${bot-s1}" fill="url(#g-red)"/>
<ellipse cx="${x}" cy="${bot+2}" rx="6.5" ry="11" fill="#d42a22" stroke="#8f1414" stroke-width=".8"/><ellipse cx="${x-2}" cy="${bot-2}" rx="2" ry="4.5" fill="#fff" opacity=".55"/>
<rect x="${x-6.5}" y="${yTop}" width="3" height="${len-10}" rx="1.5" fill="#fff" opacity=".45"/></g>`; };
function setThermo(id,T){ const m=thermoMap[id], el=document.getElementById(id); if(!m||!el) return; const y=m.y(T); el.setAttribute("y",y.toFixed(2)); el.setAttribute("height",Math.max(0,m.bot-y).toFixed(2)); return y; }

/* wooden rule. horizontal: from (x,y) length len px for cm cm; vertical if vert */
C.rule=(x,y,lenCm,px,{vert=false,w=26,label="",major=10,from=0}={})=>{ const L=lenCm*px; let t="";
  const mm=px>=7;
  for(let i=0;i<=lenCm*(mm?10:2);i++){ const cm=i/(mm?10:2), p=(cm*px).toFixed(2), isCm=Math.abs(cm-Math.round(cm))<1e-6, half=Math.abs(cm*2-Math.round(cm*2))<1e-6;
    const l=isCm?(Math.round(cm)%major===0?w*.5:w*.36):half?w*.26:w*.16;
    t+=vert?`<line x1="${x}" x2="${x+l}" y1="${y+ +p}" y2="${y+ +p}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`:`<line x1="${x+ +p}" x2="${x+ +p}" y1="${y}" y2="${y+l}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`;
    const step=px>=14?1:px>=6?5:10;
    if(isCm&&Math.round(cm)%step===0){ const v=Math.round(cm)+from; t+=vert?`<text x="${x+w*.62}" y="${y+ +p+3}" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`:`<text x="${x+ +p}" y="${y+w*.86}" text-anchor="middle" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`; } }
  return vert?`<rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="url(#g-woodV)" filter="url(#g-woodgrain)"/><rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}${label?`<text x="${x+w*.5}" y="${y+L*.5}" font-family="Arial" font-size="6" fill="#6b4e1f" transform="rotate(90 ${x+w*.5} ${y+L*.5})" text-anchor="middle">${label}</text>`:""}`
   :`<rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="url(#g-wood)" filter="url(#g-woodgrain)"/><rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}`; };

/* ---------------- canvas graph ---------------- */
function plot(cv,o){
  if(!cv||!cv.offsetParent) return null;
  const w=cv.clientWidth, h=Math.round(w*(o.aspect||.64)), dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const ink=css("--ink"), mut=css("--muted"), line=css("--line"), panel=css("--panel"), mono=css("--f-mono");
  const S=(o.series||[]).filter(s=>s.pts&&s.pts.length);
  const all=S.flatMap(s=>s.pts);
  const rng=(ax,i)=>{ let lo=ax.min, hi=ax.max; const vals=all.map(p=>p[i]);
    if(lo==null) lo=vals.length?Math.min(...vals):(ax.def||[0,10])[0]; if(hi==null) hi=vals.length?Math.max(...vals):(ax.def||[0,10])[1];
    if(ax.zero!==false){ if(ax.min==null) lo=Math.min(0,lo); if(ax.max==null) hi=Math.max(0,hi); }
    if(hi-lo<1e-9){ hi=lo+(ax.span||1); }
    const st=nice(hi-lo,ax.n||6); if(ax.min==null) lo=Math.floor(lo/st+1e-9)*st; if(ax.max==null) hi=Math.ceil(hi/st-1e-9)*st; if(hi<=lo) hi=lo+st;
    return [lo,hi,nice(hi-lo,ax.n||6)]; };
  const [x0,x1,xs]=rng(o.x,0), [y0,y1,ys]=rng(o.y,1);
  const L=58,R=16,T=16,B=44, pw=w-L-R, ph=h-T-B;
  const X=v=>L+(v-x0)/(x1-x0)*pw, Y=v=>T+(y1-v)/(y1-y0)*ph;
  const dec=st=>Math.max(0,-Math.floor(Math.log10(st)+1e-9));
  c.lineWidth=1;
  for(let v=x0;v<=x1+xs*1e-6;v+=xs/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-x0)/xs)-Math.round((v-x0)/xs))<1e-6?1:.45; c.beginPath(); c.moveTo(Math.round(X(v))+.5,T); c.lineTo(Math.round(X(v))+.5,T+ph); c.stroke(); }
  for(let v=y0;v<=y1+ys*1e-6;v+=ys/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-y0)/ys)-Math.round((v-y0)/ys))<1e-6?1:.45; c.beginPath(); c.moveTo(L,Math.round(Y(v))+.5); c.lineTo(L+pw,Math.round(Y(v))+.5); c.stroke(); }
  c.globalAlpha=1; c.strokeStyle=mut; c.lineWidth=1.4;
  const ax0=(x0<=0&&x1>=0)?X(0):L, ay0=(y0<=0&&y1>=0)?Y(0):T+ph;
  c.beginPath(); c.moveTo(ax0,T); c.lineTo(ax0,T+ph); c.moveTo(L,ay0); c.lineTo(L+pw,ay0); c.stroke();
  c.fillStyle=mut; c.font=`11.5px ${mono}`; c.textAlign="center"; c.textBaseline="top";
  for(let v=x0;v<=x1+xs*1e-6;v+=xs) c.fillText((Math.abs(v)<xs*1e-6?0:v).toFixed(dec(xs)),X(v),T+ph+6);
  c.fillText(o.x.label,L+pw/2,T+ph+24);
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=y0;v<=y1+ys*1e-6;v+=ys) c.fillText((Math.abs(v)<ys*1e-6?0:v).toFixed(dec(ys)),L-6,Y(v));
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText(o.y.label,0,0); c.restore();
  if(!S.length&&!(o.fits||[]).length){ c.textAlign="center"; const msg=o.empty||"Readings will be plotted here"; if(c.measureText(msg).width>pw-16){ const w=msg.split(" "), h=Math.ceil(w.length/2); c.fillText(w.slice(0,h).join(" "),L+pw/2,T+ph/2-8); c.fillText(w.slice(h).join(" "),L+pw/2,T+ph/2+8); } else c.fillText(msg,L+pw/2,T+ph/2); return null; }
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  (o.fits||[]).forEach(f=>{ c.strokeStyle=f.col||ink; c.lineWidth=1.6; c.globalAlpha=.9; c.setLineDash(f.dash||[]); c.beginPath();
    if(f.fn){ for(let i=0;i<=120;i++){ const xv=f.x0+(f.x1-f.x0)*i/120; const yv=f.fn(xv); i?c.lineTo(X(xv),Y(yv)):c.moveTo(X(xv),Y(yv)); } }
    else { c.moveTo(X(f.x0),Y(f.m*f.x0+f.c)); c.lineTo(X(f.x1),Y(f.m*f.x1+f.c)); }
    c.stroke(); c.setLineDash([]); c.globalAlpha=1; });
  if(o.tri){ const t=o.tri, ya=t.m*t.xa+t.c, yb=t.m*t.xb+t.c; c.strokeStyle=css("--data"); c.fillStyle=css("--data"); c.lineWidth=1.3; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(X(t.xa),Y(ya)); c.lineTo(X(t.xb),Y(ya)); c.lineTo(X(t.xb),Y(yb)); c.stroke(); c.setLineDash([]);
    c.font=`600 11px ${mono}`; c.textAlign="center"; c.textBaseline="top"; c.fillText(t.dxl||"Δx",(X(t.xa)+X(t.xb))/2,Y(ya)+(yb>ya?4:-16));
    const dw=c.measureText(t.dyl||"Δy").width; const right=X(t.xb)+8+dw<L+pw; c.textAlign=right?"left":"right"; c.textBaseline="middle"; c.fillText(t.dyl||"Δy",X(t.xb)+(right?5:-5),(Y(ya)+Y(yb))/2); }
  S.forEach(s=>{
    const pts=s.sort===false?s.pts:s.pts.slice().sort((a,b)=>a[0]-b[0]);
    if(s.join){ c.strokeStyle=s.col; c.lineWidth=1.8; c.globalAlpha=.85; c.beginPath();
      const P=pts.map(([a,b])=>[X(a),Y(b)]);
      P.forEach((p,i)=>{ if(!i){ c.moveTo(p[0],p[1]); return; } if(s.join!=="curve"){ c.lineTo(p[0],p[1]); return; }
        const p0=P[i-2]||P[i-1], p1=P[i-1], p3=P[i+1]||p; c.bezierCurveTo(p1[0]+(p[0]-p0[0])/6,p1[1]+(p[1]-p0[1])/6,p[0]-(p3[0]-p1[0])/6,p[1]-(p3[1]-p1[1])/6,p[0],p[1]); });
      c.stroke(); c.globalAlpha=1; }
    c.strokeStyle=s.col; c.lineWidth=1.7;
    if(s.ey||s.ex){ c.lineWidth=1.1; c.globalAlpha=.75; s.pts.forEach(([xv,yv],i)=>{ const x=X(xv),y=Y(yv), ey=s.ey?(Array.isArray(s.ey)?s.ey[i]:s.ey):0, ex=s.ex?(Array.isArray(s.ex)?s.ex[i]:s.ex):0;
      if(ey){ const y1=Y(yv+ey), y2=Y(yv-ey); c.beginPath(); c.moveTo(x,y1); c.lineTo(x,y2); c.moveTo(x-4,y1); c.lineTo(x+4,y1); c.moveTo(x-4,y2); c.lineTo(x+4,y2); c.stroke(); }

(()=>{
const {$,C,W,fmt,fx,sci,gauss,linfit,worst,plot,rows,build,register,clamp,setPsu}=LAB;
const H=6.626e-34, EC=1.602e-19, CL=2.998e8, PHI=1.88+Math.random()*0.16, IA=0.0006;
const LINES=[{nm:365,lbl:"365 nm (UV)",col:"#8b5cf6",rel:.9},{nm:405,lbl:"405 nm violet",col:"#8a2be2",rel:.75},{nm:436,lbl:"436 nm blue",col:"#3b5bff",rel:1},{nm:546,lbl:"546 nm green",col:"#2fbf55",rel:.85},{nm:577,lbl:"577 nm yellow",col:"#f2c418",rel:.6}];
const st={li:2,ap:0.7,V:0,data:[],view:"vs"};
LabNotebook.observe("pe",st);
const fOf=nm=>CL/(nm*1e-9), Vs=nm=>H*fOf(nm)/EC-PHI;
const I0=()=>40*LINES[st.li].rel*st.ap;
function cur(V,li=st.li){ const vs=Vs(LINES[li].nm), i0=40*LINES[li].rel*st.ap; const main=V<vs?i0*(1-V/vs)**2:0; return main-IA*i0; }
function vzero(li=st.li){ const vs=Vs(LINES[li].nm); return vs*(1-Math.sqrt(IA)); }

const stage=`<svg id="pe-svg" viewBox="0 0 900 470" role="img" aria-label="Photoelectric effect: a mercury lamp shines through a colour filter onto a vacuum photocell, with a variable reverse-bias supply, voltmeter and picoammeter">
<defs><radialGradient id="pe-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e9ddff"/><stop offset=".5" stop-color="#b9a3ff" stop-opacity=".6"/><stop offset="1" stop-color="#b9a3ff" stop-opacity="0"/></radialGradient></defs>
${C.room(320)}${C.benchFront(446)}
<g>${C.shadow(110,334,80,6)}<rect x="50" y="130" width="120" height="190" rx="8" fill="#2f3438"/><rect x="56" y="136" width="108" height="10" rx="4" fill="#fff" opacity=".08"/><rect x="164" y="196" width="22" height="48" rx="3" fill="#1d2124"/>
<circle cx="110" cy="220" r="50" fill="url(#pe-glow)" opacity=".55"/><rect x="100" y="180" width="20" height="80" rx="10" fill="#e8e0ff" opacity=".8"/><text x="110" y="300" text-anchor="middle" font-family="Arial" font-size="7" fill="#c9d2d5">MERCURY LAMP</text>
<path d="M62 150 v-14 M78 150 v-14 M94 150 v-14 M110 150 v-14 M126 150 v-14 M142 150 v-14 M158 150 v-14" stroke="#1d2124" stroke-width="5"/></g>
<g id="pe-beam"></g>
<g><rect x="232" y="176" width="16" height="96" rx="3" fill="#2b3034"/><rect x="226" y="270" width="28" height="50" fill="#3a3f43"/><rect x="214" y="316" width="52" height="10" rx="3" fill="url(#g-iron)"/><rect id="pe-filter" x="235" y="196" width="10" height="56" fill="#3b5bff" opacity=".85"/><text x="240" y="168" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#3d474b">FILTER</text></g>
<g><rect x="292" y="176" width="16" height="96" rx="3" fill="#2b3034"/><rect id="pe-iris" x="296" y="200" width="8" height="48" fill="#0d0f10"/><rect x="286" y="270" width="28" height="50" fill="#3a3f43"/><rect x="274" y="316" width="52" height="10" rx="3" fill="url(#g-iron)"/><text x="300" y="168" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#3d474b">APERTURE</text></g>
<g>${C.shadow(430,334,80,6)}<rect x="360" y="140" width="150" height="180" rx="8" fill="#1d2124"/><rect x="360" y="206" width="8" height="36" fill="#0b0d0e"/>
<ellipse cx="440" cy="222" rx="52" ry="62" fill="url(#g-glass)" stroke="#d8eef4" stroke-width="1.5"/><path d="M462 182 A38 46 0 0 1 462 262" fill="none" stroke="#b8a46a" stroke-width="7"/><path d="M462 182 A38 46 0 0 1 462 262" fill="none" stroke="#e3d08f" stroke-width="2"/>
<line x1="430" y1="186" x2="430" y2="258" stroke="#c9cfd3" stroke-width="1.6"/><rect x="420" y="280" width="40" height="24" rx="3" fill="#3a3f43"/><text x="435" y="134" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#3d474b">VACUUM PHOTOCELL</text><g id="pe-elec"></g>
<text x="472" y="300" font-family="Arial" font-size="6" fill="#c9d2d5">cathode</text><text x="396" y="300" font-family="Arial" font-size="6" fill="#c9d2d5">anode</text></g>
${C.psu(40,332,"pe-psu",{max:3,label:"VARIABLE DC SUPPLY"})}
${C.mm(560,262,"pe-vm","V","","VOLTMETER")}
<g transform="translate(690 270)">${C.shadow(85,110,90,6)}<rect width="170" height="110" rx="8" fill="#e6e7e2" stroke="#b9bbb4"/><rect x="10" y="12" width="150" height="46" rx="4" fill="#0b0f0b"/><text id="pe-pa" x="140" y="46" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="600" fill="#5dff8a">0.000</text><text x="150" y="54" text-anchor="end" font-family="Arial" font-size="7" fill="#5dff8a">nA</text>
<text x="85" y="76" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#333">PICOAMMETER</text><circle cx="40" cy="94" r="6" fill="url(#g-termRed)"/><circle cx="130" cy="94" r="6" fill="url(#g-termBlack)"/></g>
${(()=>{ const p=C.psuTerm(40,332), v=C.mmSock(560,262); return C.lead(`M${p.pos[0]} ${p.pos[1]} C ${p.pos[0]+80} 300, 470 360, 470 304`,"red")+C.lead(`M${p.neg[0]} ${p.neg[1]} C 260 440, 690 440, 730 364`,"black")+C.lead(`M820 364 C 850 440, 520 440, 440 304`,"blue")+C.lead(`M${v.v[0]} ${v.v[1]} C ${v.v[0]+10} 440, 480 380, 470 310`,"yellow")+C.lead(`M${v.com[0]} ${v.com[1]} C ${v.com[0]} 450, ${p.neg[0]+60} 450, ${p.neg[0]+2} ${p.neg[1]+4}`,"black")+C.plug(v.v[0],v.v[1],"yellow")+C.plug(v.com[0],v.com[1],"black"); })()}
</svg>`;

const panel=`
<div class="field"><div class="lbl">Filter (mercury line)</div><div class="seg c2" id="pe-f">${LINES.map((l,i)=>`<label class="opt"><input type="radio" name="pe-f" value="${i}" ${i===2?"checked":""}><span>${l.lbl}</span></label>`).join("")}</div></div>
<div class="field"><div class="lbl">Aperture (intensity) <b id="pe-apl">70%</b></div><input type="range" id="pe-ap" min="0.2" max="1" step="0.05" value="0.7" aria-label="Aperture"></div>
<div class="field"><div class="lbl">Reverse (stopping) voltage <b id="pe-vl">0.00 V</b></div><input type="range" id="pe-V" min="0" max="2.5" step="0.01" value="0" aria-label="Reverse voltage"></div>
<div class="btnrow"><button class="btn" id="pe-dn">− 0.01 V</button><button class="btn" id="pe-up">+ 0.01 V</button></div>
<div class="readout"><div><span>Photocurrent</span><b id="pe-r-I">—</b></div><div><span>Voltmeter</span><b id="pe-r-V">—</b></div></div>
<button class="btn primary" id="pe-rec">Record stopping potential</button>
<div class="field"><div class="lbl">Graph</div><div class="seg c2" id="pe-view"><label class="opt"><input type="radio" name="pe-view" value="vs" checked><span>Vₛ against frequency</span></label><label class="opt"><input type="radio" name="pe-view" value="iv"><span>I against V (this filter)</span></label></div></div>
<p class="note" id="pe-note">Increase the reverse voltage until the photocurrent just falls to zero. That voltage is the stopping potential for this frequency.</p>`;

build({id:"pe",eyebrow:"OCR A Level Physics A · Quantum extension · Photoelectric effect",title:"Photoelectric effect: stopping potential",
 intro:"Light from a mercury lamp passes through a filter onto the cathode of a vacuum photocell, releasing photoelectrons. A reverse voltage repels them from the anode; the stopping potential Vₛ is the voltage that just stops the fastest electrons, so eVₛ = KE(max) = hf − φ. Plotting Vₛ against frequency gives the Planck constant from the gradient and the work function from the intercept.",
 stage,bar:`<span>Voltmeter <b>±0.01 V</b></span><span>e <b>1.60 × 10⁻¹⁹ C</b></span><span id="pe-status"></span>`,
 panel,
 results:`<div class="tbl-wrap"><table><thead><tr><th>λ / nm</th><th>f / 10¹⁴ Hz</th><th>Vₛ / V</th><th>KE(max) / eV</th><th></th></tr></thead><tbody id="pe-tbody"></tbody></table></div>`,
 resultsBtn:`<button class="btn" id="pe-clear" style="min-height:34px;padding:5px 10px">Clear</button>`,
 graphTitle:"Stopping potential against frequency",graphSub:"Gradient = h/e",workSub:"Uses your own stopping potentials",
 info:{method:[
  "Shine light from a mercury lamp through a filter that selects one spectral line onto the cathode of a vacuum photocell.",
  "Connect a variable d.c. supply so that the anode is negative relative to the cathode (reverse bias), with a voltmeter across the cell and a sensitive (pico)ammeter in series.",
  "Increase the reverse voltage from zero until the photocurrent just falls to zero. Record this stopping potential Vₛ.",
  "Repeat for each filter. Check that changing the intensity changes the current but not the stopping potential.",
  "Plot Vₛ against frequency f = c/λ. Since eVₛ = hf − φ, the gradient is h/e, the y-intercept is −φ/e and the x-intercept is the threshold frequency."],
 vars:["Frequency of the light (filter)","Stopping potential","Cathode material, temperature, and the photocell itself"],
 safety:["Mercury lamps emit ultraviolet: never look directly at the lamp and keep the housing closed; use UV-blocking goggles.","The lamp housing becomes very hot; let it cool before moving it.","Do not touch the glass photocell's terminals while the supply is on."],
 qa:[["Why does the photocurrent fall as the reverse voltage increases?","The reverse voltage repels photoelectrons; only those with kinetic energy greater than eV reach the anode. As V rises, fewer electrons have enough energy."],
  ["Why does the stopping potential not depend on intensity?","Each electron absorbs one photon. A higher intensity means more photons per second, so more electrons, but each photon has the same energy hf, so the maximum kinetic energy is unchanged."],
  ["How is the Planck constant found from the graph?","eVₛ = hf − φ, so Vₛ = (h/e)f − φ/e. The gradient is h/e; multiply by e = 1.60 × 10⁻¹⁹ C."],
  ["What is the threshold frequency and how is it found?","The minimum frequency for photoemission, f₀ = φ/h. It is the x-intercept of the graph where Vₛ = 0."],
  ["Why is it hard to judge exactly when the current reaches zero?","The current approaches zero gradually because electrons are released with a spread of energies; also light reaching the anode can release a tiny reverse current. Both make Vₛ slightly uncertain."],
  ["Explain why the photoelectric effect supports the particle model of light.","Emission is instantaneous and depends on frequency, not intensity. Below the threshold frequency no electrons are emitted however bright the light; a wave model would allow energy to build up over time."]]}
});

/* ---------- drawing ---------- */
let tick=0;
function render(){ const L=LINES[st.li], i=cur(st.V);
  $("#pe-filter").setAttribute("fill",L.col); $("#pe-iris").setAttribute("y",(224-24*st.ap).toFixed(1)); $("#pe-iris").setAttribute("height",(48*st.ap).toFixed(1));
  $("#pe-beam").innerHTML=`<polygon points="186,200 236,204 236,240 186,244" fill="#efe6ff" opacity=".35"/><polygon points="246,${222-18*st.ap} 300,${222-18*st.ap} 300,${222+18*st.ap} 246,${222+18*st.ap}" fill="${L.col}" opacity="${L.nm<380?.18:.32}"/><polygon points="304,${222-18*st.ap} 470,${222-30*st.ap} 470,${222+30*st.ap} 304,${222+18*st.ap}" fill="${L.col}" opacity="${L.nm<380?.14:.26}"/>`;
  tick++; const n=Math.max(0,Math.round(i/I0()*8)); let e=""; for(let k=0;k<n;k++){ const t=((tick*0.03+k/n)%1); e+=`<circle cx="${(458-t*28).toFixed(1)}" cy="${(200+((k*37)%44)).toFixed(1)}" r="1.8" fill="#4fc3ff"/>`; } $("#pe-elec").innerHTML=e;
  const shown=i+gauss()*0.002; $("#pe-pa").textContent=fx(shown,3); $("#pe-r-I").textContent=`${fx(shown,3)} nA`; $("#pe-vm").textContent=fx(st.V,2); $("#pe-r-V").textContent=`${fx(st.V,2)} V`;
  setPsu("pe-psu",st.V,3,true); $("#pe-vl").textContent=`${fx(st.V,2)} V`; $("#pe-apl").textContent=`${Math.round(st.ap*100)}%`;
  $("#pe-status").textContent=Math.abs(i)<0.02*I0()?"Photocurrent ≈ 0":`${fx(i/I0()*100,0)}% of the zero-voltage current`; }
let last=0; function loop(now){ if(now-last>80&&!$("#lab-pe").hidden){ last=now; render(); } requestAnimationFrame(loop); }

/* ---------- analysis ---------- */
function pts(){ return st.data.map(r=>[fOf(r.nm)/1e14,r.V]); }
function analyse(){ const P=pts(); if(P.length<3) return null; const f=linfit(P); const w=worst(P,0.02,f); const [xa,xb]=LAB.triX(P.map(p=>p[0])); return {P,f,w,xa,xb}; }
function refresh(){ rows($("#pe-tbody"),st.data.map(r=>[r.nm,fx(fOf(r.nm)/1e14,2),fx(r.V,2),fx(r.V,2)]),"Find the stopping potential for a filter and record it.",4,true); draw(); work(); }
function draw(){ if(st.view==="iv"){ const P=[]; for(let V=0;V<=2.5001;V+=0.02) P.push([V,cur(V)]); plot($("#pe-graph"),{x:{label:"Reverse voltage / V",min:0,max:2.5},y:{label:"I / nA",min:0,max:Math.ceil(I0()/5)*5+2},series:[{pts:P,col:LINES[st.li].col,join:"line",noPts:true,label:LINES[st.li].lbl},{pts:[[st.V,cur(st.V)]],col:LAB.css("--ink")}],legend:"right"});
    $("#lab-pe .lower .card:nth-child(2) h3").textContent="Photocurrent against reverse voltage"; return; }
  const a=analyse(); const o={x:{label:"f / 10¹⁴ Hz",min:0,max:9},y:{label:"Vₛ / V",min:-2.5,max:2},series:[{pts:pts(),col:LAB.RUNCOL[0],ey:0.02}],empty:"Stopping potentials will be plotted here"};
  if(a&&a.w){ o.fits=[{m:a.f.m,c:a.f.c,x0:0,x1:9,label:"best fit"},{m:a.w.m,c:a.w.c,x0:0,x1:9,dash:[6,4],col:LAB.css("--data"),label:"worst fit"}]; o.tri={m:a.f.m,c:a.f.c,xa:a.xa,xb:a.xb}; o.legend="left"; }
  plot($("#pe-graph"),o); $("#lab-pe .lower .card:nth-child(2) h3").textContent="Stopping potential against frequency"; }
function work(){ const fitCheck=analyse(), problem=LAB.fitProblem(fitCheck); if(problem){ $("#pe-work").innerHTML=problem; return; } const el=$("#pe-work"), {v,fr,res,step,chips}=W, a=analyse(), r=st.data[st.data.length-1];
  if(!r){ el.innerHTML=`<p class="empty">Record stopping potentials for several filters and the calculation will appear here.</p>`; return; }
  const f=fOf(r.nm);
  let h=`<div class="work">`+step(1,"Frequency of the light","f = c/λ.",[`${v("f")} = ${fr("3.00 × 10⁸",`${r.nm} × 10⁻⁹`)} = ${res(`${sci(f,3)} Hz`)}`])+
   step(2,"Maximum kinetic energy","eVₛ = KE(max). In electronvolts, KE(max) has the same number as Vₛ.",[`KE(max) = ${v("e")}${v("V","s")} = 1.60 × 10⁻¹⁹ × ${fx(r.V,2)} = ${res(`${sci(EC*r.V,3)} J`)} = ${fx(r.V,2)} eV`]);
  if(a){ const hh=a.f.m*1e-14*EC, hw=a.w.m*1e-14*EC, phi=-a.f.c, f0=-a.f.c/a.f.m, pd=(hh-H)/H*100;
    h=chips([["Planck constant",`${sci(hh,3)} J s`,1],["Uncertainty",`± ${fx(a.w.pc,0)}%`],["Work function",`${fx(phi,2)} eV`],["Threshold f₀",`${fx(f0,2)} × 10¹⁴ Hz`]])+`<div style="margin-top:14px"></div>`+h+
    step(3,"Gradient = h/e","Vₛ = (h/e)f − φ/e.",[`gradient = ${fr(`${fx(a.f.m*a.xb+a.f.c,2)} − (${fx(a.f.m*a.xa+a.f.c,2)})`,`(${fx(a.xb,1)} − ${fx(a.xa,1)}) × 10¹⁴`)} = ${res(`${sci(a.f.m*1e-14,3)} V s`)}`,`${v("h")} = ${v("e")} × gradient = 1.60 × 10⁻¹⁹ × ${sci(a.f.m*1e-14,3)} = ${res(`${sci(hh,3)} J s`)}`,`worst fit ⇒ ${sci(hw,3)} J s (±${fx(a.w.pc,0)}%); accepted 6.63 × 10⁻³⁴ J s (difference ${pd>=0?"+":""}${fx(pd,1)}%)`])+
    step(4,"Work function and threshold frequency","The y-intercept is −φ/e; the x-intercept is the threshold frequency f₀.",[`y-intercept = ${fx(a.f.c,2)} V ⇒ φ = ${res(`${fx(phi,2)} eV`)} = ${sci(phi*EC,3)} J`,`${v("f","0")} = ${fr("φ",v("h"))} = ${res(`${fx(f0,2)} × 10¹⁴ Hz`)} ⇒ λ₀ = c/f₀ = ${Math.round(CL/(f0*1e14)*1e9)} nm`]); }
  el.innerHTML=h+`</div>`; }

/* ---------- controls ---------- */
const setV=V=>{ st.V=clamp(Math.round(V*100)/100,0,2.5); $("#pe-V").value=st.V; render(); if(st.view==="iv") draw(); };
$("#pe-V").addEventListener("input",e=>setV(+e.target.value));
$("#pe-dn").addEventListener("click",()=>setV(st.V-0.01)); $("#pe-up").addEventListener("click",()=>setV(st.V+0.01));
$("#pe-f").addEventListener("change",e=>{ st.li=+e.target.value; render(); if(st.view==="iv") draw(); });
$("#pe-ap").addEventListener("input",e=>{ st.ap=+e.target.value; render(); if(st.view==="iv") draw(); });
$("#pe-view").addEventListener("change",e=>{ st.view=e.target.value; draw(); });
$("#pe-rec").addEventListener("click",()=>{ const note=$("#pe-note"), i=cur(st.V), vz=vzero();
  if(i>0.02*I0()){ note.innerHTML=`<b>Current not yet zero</b> (${fx(i,3)} nA). Increase the reverse voltage.`; return; }
  if(st.V>vz+0.06){ note.innerHTML="<b>Too far:</b> the current reached zero at a lower voltage. Reduce the voltage until the current just starts to rise, then increase it again slowly."; return; }
  const nm=LINES[st.li].nm, k=st.data.findIndex(r=>r.nm===nm); if(k>=0) st.data.splice(k,1); st.data.push({nm,V:st.V}); st.data.sort((a,b)=>b.nm-a.nm);
  note.innerHTML="Recorded. Change the filter and repeat. Try changing the aperture: the current changes but the stopping potential does not."; refresh(); });
$("#pe-tbody").addEventListener("click",e=>{ const b=e.target.closest(".x"); if(!b) return; st.data.splice(+b.dataset.i,1); refresh(); });
$("#pe-clear").addEventListener("click",()=>{ st.data=[]; refresh(); });
window.__pe={st,vzero,LINES};
render(); refresh(); requestAnimationFrame(loop);
register({id:"pe",group:"ocr",num:63,name:"Photoelectric effect",lvl:"Quantum extension",icon:"photo",onShow:draw});
})();

</script>
<script>(function(){
 var KIND="lab", PAGE="pe", TARGET="lab-pe";
 try{ LAB.boot({groups:[["ocr",""],["alevel",""]]}); }catch(e){ console.error(e); }
 var page=LAB.list.filter(function(p){return p.id===PAGE;})[0];
 var section=document.getElementById('lab-'+PAGE), target=document.getElementById(TARGET);
 if(!section||!target){ document.body.insertAdjacentHTML('afterbegin','<p style="padding:16px">This animation could not be built.</p>'); return; }
 LAB.list.forEach(function(p){ var s=document.getElementById('lab-'+p.id); if(s) s.hidden=p.id!==PAGE; });
 section.hidden=false; target.setAttribute('data-anim-root','');
 for(var el=target.parentElement; el&&el!==document.body; el=el.parentElement) el.setAttribute('data-anim-path','');
 if(KIND==='lab'){ var nb=section.querySelector('.lab-notebook'); if(nb) nb.remove(); }
 if(KIND==='lab'){
  // Results tables use larger type here; when one no longer fits beside the graph, give it the full width.
  var stack=function(){ section.querySelectorAll('.lower').forEach(function(l){ var wide=[].some.call(l.querySelectorAll('.tbl-wrap'),function(w){return w.scrollWidth>w.clientWidth+2;});
    if(wide&&!l.classList.contains('anim-stacked')){ l.classList.add('anim-stacked'); window.dispatchEvent(new Event('resize')); } }); };
  new MutationObserver(stack).observe(section,{childList:true,subtree:true}); addEventListener('resize',stack); setTimeout(stack,300);
 }
 var redraw=function(){ if(page&&(page.redraw||page.onShow)) (page.redraw||page.onShow)(); };
 requestAnimationFrame(function(){ redraw(); window.dispatchEvent(new Event('resize')); });
})();</script>
<script id="lab-light-labels">
/* Light theme: labels drawn in pale grey for the old dark bench would vanish on the light bench.
   Any pale label that now sits on a light background is drawn in dark ink instead (and restored in the dark theme). */
(function(){
  function lum(c){ var m=(c||'').match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/); if(!m) return null; if(m[4]!==undefined&&+m[4]<.2) return null; return (0.2126*m[1]+0.7152*m[2]+0.0722*m[3])/255; }
  function stopLum(id){ var g=document.getElementById(id); if(!g) return null; var s=g.querySelectorAll('stop'); if(!s.length) return null; var t=0,n=0; s.forEach(function(x){ var c=getComputedStyle(x); if(+c.stopOpacity<.5) return; var l=lum(c.stopColor); if(l!=null){t+=l;n++;} }); return n?t/n:null; }
  function bgLum(el){ var cs=getComputedStyle(el), f=cs.fill, m=f.match(/url\("?#([^")]+)"?\)/); if(m) return (+cs.fillOpacity)*(+cs.opacity)<.6?null:stopLum(m[1]); if((+cs.fillOpacity)*(+cs.opacity)<.6) return null; return lum(f); }
  function light(){ return document.documentElement.getAttribute('data-theme')!=='dark'; }
  function fix(stage){
    if(!stage||!stage.offsetParent) return;
    stage.querySelectorAll('svg text').forEach(function(t){
      if(!light()){ if(t.dataset.ltInk){ t.style.fill=''; delete t.dataset.ltInk; } return; }
      if(t.dataset.ltInk||t.dataset.ltKeep) return;
      var l=lum(getComputedStyle(t).fill); if(l==null||l<.62) return;
      var r=t.getBoundingClientRect(); if(!r.width||r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth) return;
      // sample what lies behind the label at its left, middle and right; ink it only if most of it is on a light surface
      var y=r.top+r.height/2, lightN=0;
      [r.left+Math.min(3,r.width/4), r.left+r.width/2, r.right-Math.min(3,r.width/4)].forEach(function(x){
        var els=document.elementsFromPoint(x,y), b=null;
        for(var i=0;i<els.length;i++){ var e=els[i]; if(e===t||e.closest('text')) continue;
          if(!(e instanceof SVGElement)) break;
          if(/^(svg|g|line|polyline|text|tspan|defs|use)$/i.test(e.tagName)) continue;
          var l2=bgLum(e); if(l2!=null){ b=l2; break; } }
        if(b==null||b>.55) lightN++;
      });
      if(lightN>=2){ t.dataset.ltInk='1'; t.style.fill='#3b4852'; } else t.dataset.ltKeep='1';
    });
  }
  var q=false; function all(){ if(q) return; q=true; setTimeout(function(){ q=false; document.querySelectorAll('section.lab:not([hidden]) .stage').forEach(fix); },200); }
